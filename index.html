<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esencial SRL - Gestión Integral</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #1a2a6c;
            --secondary: #b21f1f;
            --accent: #fdbb2d;
            --glass: rgba(255, 255, 255, 0.9);
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #2c3e50;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        #login-screen {
            background: var(--glass);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
            backdrop-filter: blur(10px);
            width: 300px;
        }
        .logo-icon { font-size: 60px; margin-bottom: 10px; display: block; }
        input {
            padding: 15px;
            font-size: 18px;
            border-radius: 12px;
            border: 2px solid #ddd;
            width: 80%;
            text-align: center;
            margin: 20px 0;
            outline: none;
        }
        .btn-login {
            background: var(--primary);
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .container {
            display: none;
            width: 90%;
            max-width: 900px;
            background: var(--glass);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            backdrop-filter: blur(15px);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 { font-size: 38px; margin: 0; color: var(--primary); letter-spacing: 1px; }
        .welcome-card { margin-bottom: 40px; }
        .welcome-title { font-size: 24px; color: #444; margin-top: 10px; }
        .welcome-sub { font-size: 18px; color: #666; font-style: italic; margin-top: 5px; }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 20px;
        }
        .btn-menu {
            aspect-ratio: 1/1;
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .btn-menu:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }
        .btn-menu span { font-size: 45px; }

        .cet { background: #2c3e50; }
        .cd { background: #006064; }
        .rehab { background: #8e44ad; }
        .fac { background: #27ae60; }
        .saei { background: #6c5ce7; }
        .cobranzas { background: #e67e22; }

        .footer { margin-top: 40px; font-size: 13px; color: #888; font-weight: bold; }
    </style>
</head>
<body>

<div id="login-screen">
    <span class="logo-icon">🔑</span>
    <h2>Portal Esencial</h2>
    <input type="password" id="passInput" placeholder="Clave de Acceso">
    <button class="btn-login" onclick="validarAcceso()">INGRESAR</button>
</div>

<div class="container" id="main-container">
    <div class="welcome-card">
        <h1 id="titulo-principal">ESENCIAL SRL</h1>
        <div id="msg-container">
            <p id="p-saludo" class="welcome-title"></p>
            <p id="p-frase" class="welcome-sub"></p>
        </div>
    </div>
    
    <div id="menu-dinamico" class="grid-menu"></div>

    <div class="footer">
        © 2026 ESENCIAL SRL | Gestión de Excelencia en Salud
    </div>
</div>

<script>
    const claves = { PRO: "1234", ADMIN: "OSA7910" };

    function validarAcceso() {
        const input = document.getElementById('passInput').value;
        const login = document.getElementById('login-screen');
        const main = document.getElementById('main-container');
        
        if (input === claves.PRO) {
            setupUI("✨ ¡Hola Equipo!", "Compromiso y calidez en cada atención.");
            renderMenu(false);
        } else if (input === claves.ADMIN) {
            setupUI("🚀 ¡Bienvenido, Administrador!", "Tomando decisiones que impulsan el crecimiento.");
            renderMenu(true);
        } else {
            alert("❌ Acceso Denegado");
        }

        function setupUI(saludo, frase) {
            login.style.display = 'none';
            main.style.display = 'block';
            document.getElementById('p-saludo').innerHTML = `<strong>${saludo}</strong>`;
            document.getElementById('p-frase').innerText = frase;
        }
    }

    function renderMenu(isAdmin) {
        const menu = document.getElementById('menu-dinamico');
        // Base de botones para todos
        let html = `
            <button class="btn-menu cet" onclick="location.href='cet.html'"><span>🏠</span>C.E.T.</button>
            <button class="btn-menu cd" onclick="location.href='cd.html'"><span>🏫</span>CENTRO DE DÍA</button>
            <button class="btn-menu rehab" onclick="location.href='rehab.html'"><span>♿</span>REHABILITACIÓN</button>
        `;
        
        // Botones extra para el Admin
        if (isAdmin) {
            html += `
                <button class="btn-menu fac" onclick="location.href='facturacion.html'"><span>📂</span>FACTURACIÓN</button>
                <button class="btn-menu saei" onclick="location.href='saei.html'"><span>🎒</span>SAEI</button>
                <button class="btn-menu cobranzas" onclick="location.href='cobranzas.html'"><span>💰</span>COBRANZAS</button>
            `;
        }
        menu.innerHTML = html;
    }

    document.getElementById('passInput').addEventListener("keyup", e => { if (e.key === "Enter") validarAcceso(); });

    let clics = 0;
    document.getElementById('titulo-principal').onclick = () => {
        clics++;
        if(clics >= 5) {
            if(confirm("¿Actualizar sistema?")) {
                navigator.serviceWorker.getRegistrations().then(rs => {
                    for(let r of rs) r.unregister();
                    caches.keys().then(ns => { for(let n of ns) caches.delete(n); window.location.reload(true); });
                });
            }
            clics = 0;
        }
        setTimeout(() => clics = 0, 3000);
    };
</script>

</body>
</html>
