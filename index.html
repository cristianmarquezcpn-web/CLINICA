<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Integral - Inicio</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --oscuro: #2c3e50;
            --cet: #2c3e50;
            --cd: #006064;
            --rehab: #8e44ad;
            --fac: #27ae60;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h1 { 
            color: var(--oscuro); 
            margin-bottom: 30px; 
            font-size: 28px; 
            cursor: pointer; 
            user-select: none;
        }
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 200px);
            gap: 20px;
        }
        .btn-menu {
            height: 150px;
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn-menu:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .cet { background: var(--cet); }
        .cd { background: var(--cd); }
        .rehab { background: var(--rehab); }
        .fac { background: var(--fac); }
        
        .icon { font-size: 40px; }
        .footer { margin-top: 40px; font-size: 12px; color: #7f8c8d; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="titulo-principal">🏥 CLÍNICA INTEGRAL</h1>
    
    <div class="grid-menu">
        <button class="btn-menu cet" onclick="location.href='cet.html'">
            <span class="icon">🏠</span>
            C.E.T.
        </button>
        
        <button class="btn-menu cd" onclick="location.href='cd.html'">
            <span class="icon">🏫</span>
            CENTRO DE DÍA
        </button>
        
        <button class="btn-menu rehab" onclick="location.href='rehab.html'">
            <span class="icon">♿</span>
            REHABILITACIÓN
        </button>
        
        <button class="btn-menu fac" onclick="location.href='facturacion.html'">
            <span class="icon">📂</span>
            FACTURACIÓN
        </button>
    </div>

    <div class="footer">
        Sistema de Gestión Integral - 2026
    </div>
</div>

<script>
  // 1. REGISTRO Y CONTROL DE ACTUALIZACIONES AUTOMÁTICAS
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        console.log('✅ Service Worker activo');
        
        // Si detecta cambios en GitHub, fuerza la recarga
        reg.onupdatefound = () => {
          const installingWorker = reg.installing;
          installingWorker.onstatechange = () => {
            if (installingWorker.state === 'installed') {
              if (navigator.serviceWorker.controller) {
                console.log('🚀 Nueva versión encontrada. Actualizando...');
                window.location.reload();
              }
            }
          };
        };
      }).catch(err => console.error('❌ Error SW:', err));
    });
  }

  // 2. BOTÓN DE PÁNICO (5 clics en el título para limpiar todo)
  let contadorClics = 0;
  document.getElementById('titulo-principal').onclick = () => {
    contadorClics++;
    if(contadorClics >= 5) {
      if(confirm("¿Deseas forzar la actualización del sistema y limpiar la memoria caché?")) {
        // Desregistrar todos los Service Workers
        navigator.serviceWorker.getRegistrations().then(registrations => {
          for(let registration of registrations) {
            registration.unregister();
          }
          // Limpiar todas las cachés del navegador
          caches.keys().then(names => {
            for (let name of names) caches.delete(name);
            // Recarga dura desde el servidor
            window.location.reload(true);
          });
        });
      }
      contadorClics = 0;
    }
    // Reinicia el contador si no llega a 5 clics en 3 segundos
    setTimeout(() => { contadorClics = 0; }, 3000);
  };
</script>

</body>
</html>
