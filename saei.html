window.recalcular = (el) => {
    const tr = el.closest('tr');
    
    // 1. Capturamos los valores de los dos cuadros de texto y la alícuota
    let neto = parseFloat(tr.querySelector('.neto-edit').value) || 0;
    let exento = parseFloat(tr.querySelector('.exento-edit').value) || 0;
    const ali = parseFloat(tr.querySelector('.sel-ali').value) || 0;
    
    // 2. Lógica de independencia: 
    // Si elegís una alícuota con IVA (10.5 o 21), el Exento debe ser 0.
    // Si elegís Exento (0), el Neto debe ser 0.
    if (ali === 0) {
        if (neto > 0) {
            // Si el usuario escribió en Neto pero está en modo Exento, lo movemos
            exento = neto;
            tr.querySelector('.exento-edit').value = exento;
            tr.querySelector('.neto-edit').value = 0;
            neto = 0;
        }
    } else {
        if (exento > 0) {
            // Si escribió en Exento pero puso una alícuota, lo movemos a Neto
            neto = exento;
            tr.querySelector('.neto-edit').value = neto;
            tr.querySelector('.exento-edit').value = 0;
            exento = 0;
        }
    }

    // 3. Calculamos el total
    // Total = Neto + (Neto * IVA) + Exento
    const montoIva = neto * (ali / 100);
    const total = neto + montoIva + exento;

    // 4. Actualizamos el TOTAL ($) al final de la línea
    const totalRow = tr.querySelector('.total-row');
    if (totalRow) {
        totalRow.innerText = `$${total.toLocaleString('es-AR', {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        })}`;
    }
};

    async function procesarTodo() {
    const dictOS = window.dictOS || {};
	const snapGral = await db.ref('facturas_emitidas_saei').once('value');
    const snapSaei = await db.ref('facturas_emitidas').once('value');
    
    const todasLasFacturas = {
        ...(snapGral.val() || {}),
        ...(snapSaei.val() || {})
    };
    
    // Las ordenamos de mayor a menor por número para agarrar la ÚLTIMA siempre
    const facturasArray = Object.values(todasLasFacturas).sort((a, b) => {
        return (b.nro_comp || 0) - (a.nro_comp || 0);
    });

    const rutas = [
    { path: 'saei/pacientes', mod: 'SAEI' } 
    ];
    const promesas = rutas.map(obj => db.ref(obj.path).once('value'));
    const snapsPacientes = await Promise.all(promesas);

    const tempFull = [];

    snapsPacientes.forEach((snap, index) => {
        const nombreMod = rutas[index].mod;
        const pacientes = snap.val() || {};

        for (const idPac in pacientes) {
            const p = pacientes[idPac];
            
            // 1. BUSCAMOS LA ÚLTIMA FACTURA O NC
            let ultFact = facturasArray.find(f => 
                (f.id_paciente === idPac || f.id_paciente_db === idPac) && 
                String(f.modulo).toUpperCase() === String(nombreMod).toUpperCase()
            );

            // --- AQUÍ ESTÁ LO QUE PEDÍAS: Lógica de NC ---
            if (ultFact && (ultFact.tipo_comp == 3 || ultFact.tipo_comp == 8)) {
                // Si la última es una NC, nos aseguramos de que los datos de asociación existan
                // Por si en la DB vieja estaban con otro nombre, los normalizamos acá:
                ultFact.asoc_num = ultFact.asoc_num || ultFact.factura_asoc_num || "";
                ultFact.asoc_fecha = ultFact.asoc_fecha || ultFact.factura_asoc_fecha || "";
            }

            // 2. FILTRO ANTI-GRIS (Tu lógica de refacturación)
            let estadoFinal = (ultFact && ultFact.cae) ? 'SI' : 'NO';
            if (p.facturado === 'NO') {
                estadoFinal = 'NO';
            }

            tempFull.push({
                ...p,
                id: idPac, // Nombre del paciente (Key)
                mod: nombreMod,
                ultima_factura: ultFact, 
                facturado: estadoFinal   
            });
        }
    });
    
    dataFull = tempFull;
    
    if (typeof render === "function") {
        render();
    }
}

	window.recalcularTotales = function(el) {
    const tr = el.closest('tr');
    const netoInput = tr.querySelector('.neto-edit');
    const exentoInput = tr.querySelector('.exento-edit');
    const aliSelect = tr.querySelector('.sel-ali');
    const totalTd = tr.querySelector('.total-render');

    let neto = parseFloat(netoInput.value) || 0;
    let exento = parseFloat(exentoInput.value) || 0;
    let ali = parseFloat(aliSelect.value) || 0;

    // --- REGLA: Si es EXENTO, el neto se mueve al exento ---
    if (ali === 0 && neto > 0) {
        exento = neto;
        neto = 0;
        netoInput.value = 0;
        exentoInput.value = exento;
    }

    const total = neto + (neto * ali / 100) + exento;
    totalTd.innerText = `$ ${total.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
};

	function procesarFacturaAprobada(respuestaAfip, datosPedido) {

    const facturaLegal = {

        periodo_hasta: datosPedido.periodo_hasta || "",
        vto_pago: datosPedido.vto_pago || "",

        cuit: datosPedido.cuit || "",
        domicilio: datosPedido.domicilio || "",
        modulo: moduloUpper
    };

    let updates = {};

    // 3. ACTUALIZACIÓN MULTI-RUTA
    updates['/' + rutaHistorial + '/' + nuevaFacturaKey] = facturaLegal;
    
    if (facturaLegal.id_paciente) {

}

    if (filasFacturadas.length === 0) {
        return alert("No hay pacientes facturados para replicar en este módulo.");
    }

    if (!confirm(`¿Deseas volver a enviar a la cola de AFIP a los pacientes de ${modulo}?`)) return;

    const updates = {};
    let contador = 0;

    filasFacturadas.forEach(tr => {
        const ck = tr.querySelector('.ck');
        
        // Verificamos que sea del módulo correcto
        if (ck && ck.dataset.mod.toUpperCase() === modulo.toUpperCase()) {
            const idPaciente = ck.dataset.id;
            const nuevaKey = db.ref().child('cola_facturacion').push().key;

            // --- SINCRONIZACIÓN TOTAL CON enviarAFIP_WS ---
            const montoNeto = parseFloat(tr.querySelector('.neto-edit')?.value) || 0;
            const montoExento = parseFloat(tr.querySelector('.exento-edit')?.value) || 0;
            const alicuota = parseFloat(tr.querySelector('.sel-ali')?.value) || 0;
            const tipoComp = parseInt(tr.querySelector('.sel-tipo')?.value) || 6;

            // Calculamos el total real para que el pedido vaya completo
            const totalReal = montoNeto + (montoNeto * (alicuota / 100)) + montoExento;

            updates['/cola_facturacion/' + nuevaKey] = {
                id_paciente: idPaciente,
                nombre_paciente: ck.dataset.nombre || idPaciente,
                modulo: modulo.toUpperCase(),
                razon_social: tr.querySelector('.rs-val')?.value || "",
                cuit: (tr.querySelector('.cuit-val')?.value || "").replace(/\D/g, ''),
                domicilio: tr.querySelector('.dom-val')?.value || "SAN JUAN",
                tipo: tipoComp,
                neto: montoNeto,
                exento: montoExento,
                alicuota: alicuota,
                total: totalReal,
                descripcion: tr.querySelector('.det-val')?.value || "MENSUALIDAD " + modulo.toUpperCase(),
                // Fechas: El motor usará las que cargaste en los inputs globales del panel
                periodo_desde: document.getElementById('per_desde')?.value || "", 
                periodo_hasta: document.getElementById('per_hasta')?.value || "",
                vto_pago: document.getElementById('vto_pago')?.value || "",
                condicion_venta: document.getElementById('cond_venta')?.value || "Cuenta Corriente",
                condicion_iva: "IVA Sujeto Exento",
                estado: "PENDIENTE",
                fecha_peticion: new Date().toISOString()
            };
            contador++;
        }
    });

    if (contador > 0) {
        try {
            await db.ref().update(updates);
            
            if (typeof window.cargarArchivo === 'function') {

window.cargarArchivo = async () => {
    const filtro = document.getElementById('mes_filtro_archivo').value; 
    const body = document.getElementById('tabla_archivo_body') || document.getElementById('body-archivo');
    const elTotSaei = document.getElementById('tot-saei'); // O el ID que uses para el total de SAEI

    if (!filtro) return alert("Seleccioná un mes para ver el historial.");
    if (!body) return;

    body.innerHTML = '<tr><td colspan="6" style="text-align:center;">Cargando historial SAEI...</td></tr>';

    try {
        // --- 1. SOLAMENTE TRAEMOS SAEI ---
        const snapSaei = await db.ref('facturas_emitidas_saei').once('value');
        const facturas = snapSaei.val() || {};
        
        let registrosFiltrados = []; 
        let tGral = 0;

        Object.keys(facturas).forEach(id => {
            const f = facturas[id];
            if (!f) return;

            // --- NORMALIZACIÓN DE FECHA ---
            const fechaOriginal = f.fecha_emision || f.fecha || "";
            let mesAnio = "";
            let diaMes = "";

            if (fechaOriginal.includes('-')) {
                const p = fechaOriginal.split('-');
                mesAnio = `${p[0]}-${p[1].padStart(2, '0')}`;
                diaMes = `${p[2]}/${p[1]}`;
            } else if (fechaOriginal.includes('/')) {
                const p = fechaOriginal.split('/');
                if (p.length === 3) {
                    mesAnio = `${p[2]}-${p[1].padStart(2, '0')}`;
                    diaMes = `${p[0]}/${p[1]}`;
                }
            }

            // --- FILTRADO POR MES ---
            if (mesAnio === filtro) {
                registrosFiltrados.push({ id_db: id, ...f, diaMes_formato: diaMes });
            }
        });

        // --- 2. ORDENAMIENTO NUMÉRICO DESCENDENTE ---
        registrosFiltrados.sort((a, b) => {
            const nroA = parseInt(a.nro_comp || a.nro || 0);
            const nroB = parseInt(b.nro_comp || b.nro || 0);
            return nroB - nroA; 
        });

        // --- 3. CONSTRUCCIÓN DEL HTML ---
        let html = "";
        registrosFiltrados.forEach(f => {
            const imp = parseFloat(f.total_facturado || f.total || 0);
            const tComp = String(f.tipo_comp || f.tipo_cod || "").trim();
            const esNC = (tComp === "8" || tComp === "3" || tComp === "13");
            const valorEfectivo = esNC ? -imp : imp;
            tGral += valorEfectivo;

            const estiloFila = esNC ? 'style="color: #d9534f; font-weight: bold; background-color: #fff5f5;"' : '';
            const signo = esNC ? "- " : "";
            const nombreFinal = (f.receptor_nombre || f.nombre || f.razon_social || "PACIENTE SIN NOMBRE").toUpperCase();

            html += `<tr ${estiloFila}>
                <td style="text-align:center">${f.diaMes_formato}</td>
                <td><b>00005-${String(f.nro_comp || f.nro || 0).padStart(8, '0')}</b></td>
                <td><small>${f.cae || '<span style="color:orange">PROCESANDO...</span>'}</small></td>
                <td>${nombreFinal} <br><small>SAEI</small></td>
                <td style="text-align:right">${signo}$ ${imp.toLocaleString('es-AR', {minimumFractionDigits:2})}</td>
                <td style="text-align:center">
                    <button onclick="window.descargarFactura('${f.id_db}')" class="btn" style="background:#2980b9; color:white; border:none; padding:2px 5px; font-size:9px; cursor:pointer;">PDF</button>
                </td>
            </tr>`;
        });

        body.innerHTML = html || '<tr><td colspan="6" style="text-align:center;">No hay movimientos SAEI en este mes.</td></tr>';
        
        // Actualizamos el total del panel (si existe el elemento)
        if(elTotSaei) elTotSaei.innerText = `$ ${tGral.toLocaleString('es-AR', {minimumFractionDigits:2})}`;
        // Si tenés un total general en ese panel, también lo actualizamos
        const elGral = document.getElementById('tot-general');
        if(elGral) elGral.innerText = `$ ${tGral.toLocaleString('es-AR', {minimumFractionDigits:2})}`;

    } catch (error) {
        console.error("Error en cargarArchivo SAEI:", error);
        body.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">Error al cargar datos.</td></tr>';
    }
};

    const condIVA = datosOS.condicionIva || 'IVA Sujeto Exento';
    document.getElementById('f-condicion-iva').value = condIVA;

    // --- LÓGICA DE COMPROBANTE ---
    document.getElementById('f-tipo').value = (condIVA === 'RI' || condIVA === 'Responsable Inscripto') ? "001" : "006";
    
    const elPunto = document.getElementById('f-punto');
    if (elPunto) elPunto.value = "5"; 

    // --- DETALLE DE LA FACTURA ---
    const mesActual = new Intl.DateTimeFormat('es-ES', { month: 'long' }).format(new Date());
    document.getElementById('f-concepto').value = `PRESTACIÓN SERVICIO SAEI: ${p.nombre || idPaciente}. MES: ${mesActual.toUpperCase()}`;
    
    // --- ATRIBUTOS PARA EL BOTÓN ENVIAR ---
    const btnAFIP = document.getElementById('btn-enviar-afip');
    if (btnAFIP) {
        btnAFIP.setAttribute('data-id-paciente', idPaciente);
        btnAFIP.setAttribute('data-modulo-paciente', 'saei'); 
        // Habilitamos el botón por si estaba deshabilitado por una validación previa
        btnAFIP.disabled = false;
        btnAFIP.style.opacity = "1";
    }

    // --- INFORMACIÓN DE ASISTENCIA (SOLO AVISO, NO BLOQUEO) ---
    const avisoAsistencia = document.getElementById('aviso-asistencia-info'); // Asegurate de tener este ID en tu HTML
    if (typeof validarAsistenciaParaFactura === "function") {
        // Llamamos a la validación para que pinte los textos, 
        // pero NO dejamos que bloquee el flujo de facturación.
        validarAsistenciaParaFactura(idPaciente);
    } else {
        // Si no existe la función, al menos informamos en consola
        console.log("Aviso: Facturando sin validación de asistencia previa.");
    }
}
// 2. FUNCIÓN PARA LIMPIAR Y REFACTURAR EL MES QUE VIENE
window.refacturarMasivoProximoMes = async function() {
    const confirmacion = confirm("¿Habilitar TODOS los pacientes de SAEI para el próximo mes? (Se ignorarán las facturas actuales)");
    if(!confirmacion) return;
    
    try {
        const path = "saei/pacientes";
        const snap = await db.ref(path).once('value');
        const data = snap.val();

        if (data) {
            const updates = {};
            Object.keys(data).forEach(id => {
                updates[id + "/facturado"] = "NO";
                if (data[id].ultima_factura && data[id].ultima_factura.id) {
                    updates[id + "/ignorar_factura"] = data[id].ultima_factura.id;
                }
            });
            await db.ref(path).update(updates);
            alert("✅ ¡Módulo SAEI reseteado para el nuevo mes!");
            location.reload();
        } else {
            alert("No hay pacientes cargados en SAEI.");
        }
    } catch (error) {
        console.error("Error al resetear SAEI:", error);
        alert("Error: " + error.message);
    }
};

// FUNCIÓN PARA FIJAR DATOS: Guarda detalle e importe automáticamente

window.fijarDatoPermanente = async function(idPaciente, valor, campo) {

    const paciente = dataFull.find(p => p.id === idPaciente);

    if (paciente) {

        try {

            const modPath = paciente.mod.toLowerCase();

            

            // CONVERSIÓN DE SEGURIDAD: 

            // Si el campo es 'neto' o 'total', lo guardamos como número real

            let valorAFijar = valor;

            if (campo === 'neto' || campo === 'total') {

                valorAFijar = parseFloat(valor) || 0;

            }



            // Guardamos en la ficha original del paciente

            await db.ref(`/${modPath}/pacientes/${idPaciente}/${campo}`).set(valorAFijar);

            

            // Actualizamos dataFull en memoria para que no necesites recargar la página

            paciente[campo] = valorAFijar; 



            console.log(`✅ Grabado permanente: ${campo} = ${valorAFijar}`);

        } catch (error) {

            console.error("❌ Error al fijar dato:", error);

        }

    }

};
	
window.descargarUltimaDePaciente = async (idPac) => {
    try {
        // 1. Traemos SOLO la carpeta SAEI
        const snapS = await db.ref('facturas_emitidas_saei').once('value');
        const todas = snapS.val() || {};
        let ultimaId = null;

        // 2. Ordenamos las llaves de Firebase (IDs) de mayor a menor
        const llavesOrdenadas = Object.keys(todas).sort().reverse();

        for (let id of llavesOrdenadas) {
            const f = todas[id];
            // Verificamos coincidencia de ID de paciente
            if (f.id_paciente === idPac || f.id_paciente_db === idPac || f.receptor_id === idPac) {
                ultimaId = id; 
                break; // La primera que encontramos es la más reciente
            }
        }

        if (ultimaId) {
            window.descargarFactura(ultimaId);
        } else {
            alert("No se encontró ninguna factura en SAEI para el paciente: " + idPac);
        }

    } catch (error) {
        console.error("Error al buscar última factura SAEI:", error);
        alert("Error de conexión al recuperar la factura.");
    }
};
	// --- 1. SELECCIONAR TODOS (Solo visibles) ---
window.seleccionarTodos = function(master) {
    const filas = document.querySelectorAll('#tabla-body tr');
    filas.forEach(fila => {
        // Si la fila está oculta por el filtro, no la seleccionamos
        if (fila.style.display !== 'none') {
            const ck = fila.querySelector('.ck');
            if (ck && !ck.disabled) {
                ck.checked = master.checked;
            }
        }
    });
};

// --- 2. FILTRADO MULTICOLUMNA ---
window.filtrarRender = function() {
    const filtros = document.querySelectorAll('.f-filtro');
    const filas = document.querySelectorAll('#tabla-body tr');

    filas.forEach(fila => {
        let mostrar = true;
        filtros.forEach(inputFiltro => {
            const valorBusqueda = inputFiltro.value.toLowerCase().trim();
            if (valorBusqueda === "") return;

            const colIndex = parseInt(inputFiltro.getAttribute('data-col'));
            const celda = fila.cells[colIndex];
            
            if (celda) {
                const inputInterno = celda.querySelector('input, textarea');
                let textoComparar = inputInterno ? inputInterno.value : celda.innerText;
                if (textoComparar.toLowerCase().indexOf(valorBusqueda) === -1) {
                    mostrar = false;
                }
            }
        });
        fila.style.display = mostrar ? "" : "none";
    });
};
	db.ref('facturas_emitidas_saei').on('value', (snap) => {
    console.log("⚡ Cambio detectado en Facturas SAEI, actualizando interfaz...");
    // Esto hace que si facturás desde otra pestaña, esta se actualice sola (los botones se pongan grises, etc.)
    if (typeof cargarTodo === 'function') cargarTodo(); 
});
