<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CFO TITANIUM v8.5 - INTELIGENCIA FULL</title>

    <style>
        * { box-sizing: border-box; }
        :root { 
            --bg: #05070a; 
            --panel: #111827; 
            --ac: #3b82f6;  /* Azul (AC) */
            --p: #10b981;   /* Verde (P) */

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg);

            margin: 0; 
            padding: 25px; 
            width: 100vw; 
            overflow-x: hidden; 
        }
        
        .grid-master { 
            display: grid; 
            grid-template-columns: minmax(280px, 1fr) minmax(400px, 2fr) minmax(280px, 1fr); 
            gap: 20px;

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; overflow-y: auto; }
        .modal-contenido { background: #0f172a; margin: 5% auto; padding: 30px; width: 90%; max-width: 600px; border-radius: 12px; border: 1px solid var(--ac); }
        
        @media (max-width: 1200px) {
            .grid-master { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="modal-contenido" onclick="event.stopPropagation()">
        <h3>Panel de Análisis de Semana</h3>
        <div id="contenidoModal"></div>
    </div>
</div>
<div id="modalDetalle" class="modal" onclick="this.style.display='none'"></div>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:15px;">

    <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="month" id="mesFiltro" onchange="conectarMes()" style="width:auto; margin:0;">
        <button class="btn" onclick="dispararMotorTitanium()" style="background:var(--oro); color:black; width:auto; padding:0 20px;">⚡ SINCRO</button>
        <button class="btn" onclick="generarInformeJunta()" style="background:var(--p); color:white; width:auto; padding:0 20px;">📄 INFORME</button>
        <button class="btn" onclick="window.location.reload()" style="background:#475569; color:white; width:auto; padding:0 20px;">🔄 RECONECTAR</button>
        <button onclick="window.location.href='index.html'" style="background: transparent; border: 1px solid #374151; color: #94a3b8; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 11px;">← VOLVER</button>
    </div>
</div>

<div class="grid-master">
    <div>
        <div class="card">
            <h3>🏦 Saldo Inicial</h3>
            <input type="number" id="bancoGalicia" placeholder="Caja Galicia" onchange="guardarBancos()">
            <input type="number" id="bancoSantander" placeholder="Caja Santander" onchange="guardarBancos()">
        </div>
        <div class="card" style="width:100%; box-sizing:border-box;">
        <h3>💸 Gastos Operativos</h3>
        <div id="contGastos" style="max-height: 500px; overflow-y: auto; padding-right: 5px;"></div>
    
        <button class="btn" style="background:#1f2937; width:100%; margin-top:10px;" onclick="nuevaCategoria()">
        + NUEVO RUBRO
        </button>
        </div>
        </div>
        <div class="card">
            <h3>📊 Resumen de Salud</h3>
            <div id="saludNegocio"></div>
        </div>
    </div>

    <div>
        <div class="card" style="overflow-x: auto;">
            <h3>📈 Flujo Semanal</h3>
            <div style="display:grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap:10px;" id="gridSemanas"></div>

            <h3>📋 Inteligencia por Cliente</h3>

        </div>

    <div>
        <div class="card">

            <div id="statusIA" style="color:var(--ac); margin-bottom:10px;">Escaneando...</div>

        </div>
        
        <div class="card" style="border:1px solid var(--ac);">
            <h3>⚡ SIMULADOR DE IMPACTO</h3>
            <input type="number" id="simMonto" placeholder="Monto a inyectar/retirar ($)">
            <input type="number" id="simMeses" placeholder="Cantidad de meses">
            <button class="btn" onclick="simularImpacto()" style="margin-top:10px;">CALCULAR IMPACTO</button>

        </div>

        <div class="card" style="background:var(--a); color:white; border:none;">

            <button class="btn" style="background:white; color:var(--a);" onclick="ejecutarStressTest()">EJECUTAR STRESS TEST</button>

                <div id="oxigenoCalculado" style="margin-top:10px; font-size:12px;"></div>

</div>

<script>
// --- 1. CONFIGURACIÓN E INICIALIZACIÓN FIREBASE ---
const firebaseConfig = { 
    apiKey: "AIzaSyAugXXx_b_wKFByhDbLZslk2HA_UTzrzd8",

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
firebase.auth().onAuthStateChanged((user) => { if (user) conectarMes(); });

const db = firebase.database();

let refMes = null; 
let datosMes = {};
let motorGlobal = {};
window.totalGastosProyectados = 500000; 

function dispararMotorTitanium() {
    db.ref('comandos/ejecutar_motor').set({ status: 'request', timestamp: Date.now() });
    if(document.getElementById('statusIA')) document.getElementById('statusIA').innerText = "Sincronizando con IA...";
}

function guardarBancos() {
    const gal = parseFloat(document.getElementById('bancoGalicia').value) || 0;
    const san = parseFloat(document.getElementById('bancoSantander').value) || 0;
    const mes = document.getElementById('mesFiltro').value;
    if(mes) db.ref('tesoreria/meses/' + mes + '/bancos').set({ galicia: gal, santander: san });
}
function calcularDelayPromedio(data) {
    if (!data || !data.inteligencia_cuit) return 0;
    
    let totalDelay = 0;
    let totalDeuda = 0;
    
    Object.keys(data.inteligencia_cuit).forEach(cuit => {
        const d = data.inteligencia_cuit[cuit];
        // Asumiendo que cada objeto tiene 'delay' y 'deuda_viva'
        const delay = d.delay || 0;
        const deuda = d.deuda_viva || 0;
        
        totalDelay += (delay * deuda);
        totalDeuda += deuda;
    });
    
    return totalDeuda > 0 ? Math.round(totalDelay / totalDeuda) : 0;
}
async function simularImpacto() {
    const montoSimulado = parseFloat(document.getElementById('simMonto').value) || 0;
    const mesesSimulados = parseInt(document.getElementById('simMeses').value) || 1;
    const res = document.getElementById('resImpacto');
    if (!res) return;

    const motorData = window.motorGlobal || {};
    let saldoPesimista = motorData.var_pesimista || 0;
    const saldoActual = (parseFloat(document.getElementById('bancoGalicia').value) || 0) + (parseFloat(document.getElementById('bancoSantander').value) || 0);
    
    let tempSaldo = saldoActual + saldoPesimista;
    const burnRate = motorData.burn_rate || 0;
    const gastoMensualPesimista = montoSimulado + burnRate;
    
    let quiebraEn = 0;
    for (let i = 1; i <= mesesSimulados; i++) {
        tempSaldo -= gastoMensualPesimista;
        if (tempSaldo < 0 && quiebraEn === 0) { quiebraEn = i; }
    }

    const esViable = quiebraEn === 0;
    res.style.color = esViable ? "var(--p)" : "var(--a)";
    
    if (esViable) {
        res.innerText = `✅ ESCENARIO PESIMISTA: Titanium confirma soporte por ${mesesSimulados} meses. Saldo final: $${Math.round(tempSaldo).toLocaleString()}`;
    } else {
        res.innerText = `🚨 ALERTA: Bajo condiciones pesimistas (Montecarlo), quiebra técnica en el mes ${quiebraEn}.`;
    }
}
db.ref('tesoreria/motor_ia').on('value', snap => {
    const val = snap.val();
    if (!val) return;
    window.motorGlobal = val;
    // Asignación de objetos principales
    const m = val.mercado || {};
    const rep = val.reporte || {};
    const diag = val.diagnostico_matematico || {};
    const indic = val.indicadores_globales || {}; // NUEVO OBJETO
    const consejos = val.bot_financiero || [];
    
    // Lógica de Colores
    const colorRiesgo = (m.riesgo || 0) > 1300 ? 'var(--a)' : 'var(--oro)';
    const colorEstado = rep.estado === "CRÍTICO" ? 'var(--a)' : 'var(--p)';
    const colorSemaforo = indic.semaforo === "ROJO" ? 'var(--a)' : (indic.semaforo === "AMARILLO" ? 'var(--oro)' : 'var(--p)');
    
    const salud = document.getElementById('saludNegocio');
    if (salud) {
        salud.innerHTML = `<div style="padding:10px; background:#000; border-radius:8px; border:1px solid #374151; font-size:12px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>Ratio Liquidez:</span> <b>${(diag.ratio_liquidez || 0).toLocaleString()}</b></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>Riesgo Concent.:</span> <b>${(diag.riesgo_concentracion || 0).toFixed(0)}</b></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>Precisión IA:</span> <b style="color:var(--p)">${((diag.accuracy_history || 0) * 100).toFixed(0)}%</b></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>Calle:</span> <b>$${(rep.calle || 0).toLocaleString()}</b></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>Esperado:</span> <b>$${(rep.esperado || 0).toLocaleString()}</b></div>
            <div style="display:flex; justify-content:space-between;"><span>Delay Global:</span> <b style="color:var(--ac)">${indic.delay_global_promedio || 0} días</b></div>
        </div>`;
    }

    const econ = document.getElementById('dataEconomica');
    if (econ) {
        econ.innerHTML = `
            <div style="font-size:11px; line-height:1.6;">
                <div style="margin-bottom:10px; padding:5px; border-radius:4px; background:${colorSemaforo}22; border:1px solid ${colorSemaforo}; text-align:center;">
                    <b style="color:${colorSemaforo}">ESTADO: ${indic.semaforo || 'NORMAL'}</b>
                </div>

                <div style="display:flex; justify-content:space-between;"><span>Efectividad:</span> <b style="color:${colorEstado}">${((rep.esperado/(rep.calle || 1)) * 100).toFixed(1)}%</b></div>
                <div style="display:flex; justify-content:space-between;"><span>Supervivencia:</span> <b style="color:var(--a)">${rep.supervivencia_dias || 0} días</b></div>
                <hr style="border:0; border-top:1px solid #1f2937; margin:8px 0">
                
                <div style="display:flex; justify-content:space-between;"><span>Tasa Real PF:</span> <b style="color:var(--p)">${(diag.tasa_real_pf || 0).toFixed(1)}%</b></div>
                <div style="display:flex; justify-content:space-between;"><span>Inflación (REM):</span> <b style="color:${(m.rem || 0) > 4 ? 'var(--a)' : 'var(--p)'}">${m.rem || 0}%</b></div>
                <div style="display:flex; justify-content:space-between;"><span>Dólar MEP:</span> <b style="color:var(--ac)">$${m.mep || '-'}</b></div>
                <div style="display:flex; justify-content:space-between;"><span>Riesgo País:</span> <b style="color:${colorRiesgo}">${m.riesgo || 0} pts</b></div>
                
                <div style="margin-top:12px; padding:8px; background:#000; border-radius:6px; font-size:10px; border-left:2px solid ${colorSemaforo};">
                    📢 <b>DIAGNÓSTICO:</b> ${indic.mensaje_racional || 'Analizando...'}
                </div>
                <div style="margin-top:5px; padding:8px; background:#000; border-radius:6px; font-size:10px; border-left:2px solid var(--oro);">
                    🤖 <b>AI BOT:</b> ${consejos[0] || 'Analizando mercado...'}
                </div>
            </div>`;
  }
    const status = document.getElementById('statusIA');
    if (status) status.innerText = `Motor ${val.estado_api || ''} | Sincro: ${val.ultima_sincro || 'Pendiente'}`;
    renderizarDashboardTopeDeGama();
});

    // 1. FUNCIÓN RENDERIZAR DASHBOARD
function renderizarDashboardTopeDeGama() {
    const contenedor = document.getElementById('dashboardCompleto');
    if (!contenedor) return;

    // Si los datos no están cargados, no imprimimos error, simplemente salimos 
    // sin hacer nada para no ensuciar la consola.
    if (!window.motorGlobal || !window.motorGlobal.inteligencia_cuit) {
        return; 
    }

    const data = window.motorGlobal.inteligencia_cuit;
    const cuits = Object.keys(data);
    
    // Cálculos
    const totalDelay = cuits.reduce((acc, cuit) => acc + (data[cuit].delay_estimado || 0), 0);
    const promedioCartera = totalDelay / cuits.length;
    cuits.sort((a, b) => (data[b].deuda_viva || 0) - (data[a].deuda_viva || 0));

    let html = `<style>.card-c:hover { background: #1e293b !important; border-color: #475569 !important; }</style>`;

    cuits.forEach(cuit => {
        const d = data[cuit];
        const colorBorde = d.delay_estimado > promedioCartera ? '#ef4444' : '#10b981';
        
        html += `
        <div class="card-c" style="border-left: 4px solid ${colorBorde}; background:#111827; padding:10px; margin-bottom:6px; border-radius:4px; display:flex; align-items:center; gap:12px; transition:0.2s; border:1px solid #1e293b;">
            <input type="checkbox" class="selector-cliente" data-deuda="${d.deuda_viva || 0}" style="cursor:pointer; width:16px; height:16px;">
            <div style="flex:1; cursor:pointer;" onclick="abrirModalDetalle('${cuit}')">
                <div style="font-size:12px; font-weight:500; color:#f8fafc;">${d.nombre_fantasia || cuit}</div>
            </div>
            <div style="text-align:right;">
                <div style="font-size:12px; font-weight:700; color:#10b981;">$${(d.deuda_viva / 1000).toFixed(0)}k</div>
            </div>
        </div>`;
    });
    
    contenedor.innerHTML = html;
}
// 2. MODAL CON LÓGICA DE FECHA CORREGIDA
function abrirModalDetalle(cuit) {
    const d = motorGlobal.inteligencia_cuit[cuit];
    const modal = document.getElementById('modalDetalle');
    
    // Lógica robusta de fecha: convertimos YYYY-MM-DD a timestamp para comparar
    const facturas = d.facturas_pendientes || [];
    const fechaProxima = facturas.length > 0 ? facturas[0].proximo_cobro_estimado : null;
    
    let estaVencido = false;
    if (fechaProxima) {
        const [y, m, d_f] = fechaProxima.split('-').map(Number);
        const fechaCobro = new Date(y, m - 1, d_f);
        const hoy = new Date();
        hoy.setHours(0,0,0,0);
        estaVencido = fechaCobro < hoy;
    }

    const colorScore = d.score < 50 ? '#ef4444' : '#22c55e';
    const colorFecha = estaVencido ? '#ef4444' : '#22c55e';
    const alerta = d.alerta_analitica || { dias_de_offset: 0, nota: "Sin notas." };

    modal.innerHTML = `
    <div class="modal-contenido" style="background:#0b0e14; padding:20px; border-radius:8px; border:1px solid #374151; color:white; max-width:500px; margin:auto;">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <h3 style="margin:0; color:#3b82f6; word-break:break-word;">${d.nombre_fantasia}</h3>
            <button onclick="document.getElementById('modalDetalle').style.display='none'" style="background:none; border:none; color:white; cursor:pointer;">❌ CERRAR</button>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; border-bottom:1px solid #334155; padding-bottom:15px; margin-bottom:15px;">
            <div>
                <small style="color:#666; font-size:10px;">DEUDA VIVA</small>
                <div style="font-size:18px;">$${d.deuda_viva.toLocaleString()}</div>
            </div>
            <div>
                <small style="color:#666; font-size:10px;">PRÓXIMO COBRO</small>
                <div style="color:${colorFecha}; font-weight:bold; font-size:18px;">${fechaProxima || 'N/A'} ${estaVencido ? '⚠️' : ''}</div>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-bottom:20px;">
            <div style="background:#1e293b; padding:10px; border-radius:4px;">
                <small style="font-size:9px; color:#94a3b8;">DELAY EST.</small>
                <div style="font-size:14px; color: ${d.delay_estimado > 60 ? '#ef4444' : '#22c55e'}">${d.delay_estimado} días</div>
            </div>
            <div style="background:#1e293b; padding:10px; border-radius:4px;">
                <small style="font-size:9px; color:#94a3b8;">SCORE IA</small>
                <div style="font-size:14px; color:${colorScore}">${d.score}</div>
            </div>
            <div style="background:#1e293b; padding:10px; border-radius:4px;">
                <small style="font-size:9px; color:#94a3b8;">TENDENCIA</small>
                <div style="font-size:14px;">${d.tendencia_admin}</div>
            </div>
        </div>

        <div style="background:#0f172a; padding:10px; border-radius:4px; font-size:11px; border:1px solid #334155;">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>Efectividad:</span> <b>${(d.efectividad * 100).toFixed(0)}%</b></div>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;"><span>Patrón:</span> <b>${d.patron}</b></div>
            <div style="display:flex; justify-content:space-between;"><span>Offset:</span> <b>${alerta.dias_de_offset} días</b></div>
            <p style="color:#666; margin-top:10px; font-style:italic;">Nota: ${alerta.nota}</p>
        </div>
    </div>`;
    
    modal.style.display = 'block';
}
    async function ejecutarStressTest() {
    const seleccionados = document.querySelectorAll('.selector-cliente:checked');
    let impactoTotal = 0;
    seleccionados.forEach(chk => impactoTotal += parseFloat(chk.dataset.deuda || 0));

    if (seleccionados.length === 0) {
        alert("Selecciona al menos un cliente del panel inferior para simular un impago.");
        return;
    }

    const saldoActual = motorGlobal.reporte?.esperado || 0;
    const nuevoSaldo = saldoActual - impactoTotal;
    const gastosM = window.totalGastosProyectados > 0 ? window.totalGastosProyectados : 500000; 
    
    const resStress = document.getElementById('resStress');
    const panelAjuste = document.getElementById('panelAjuste');
    
    resStress.innerHTML = `
        <div>Pérdida de flujo proyectado: <b style="color:var(--oro)">-$${impactoTotal.toLocaleString()}</b></div>
        <div style="margin-top:5px; padding-top:5px; border-top:1px solid rgba(255,255,255,0.2);">
            Nuevo estado de caja: <b style="color:${nuevoSaldo < 0 ? 'var(--a)' : 'var(--p)'};">$${nuevoSaldo.toLocaleString()}</b>
        </div>
    `;

    if (nuevoSaldo < 0) {
        panelAjuste.style.display = 'block';
        const bache = Math.abs(nuevoSaldo);
        const ahorroPotencial = gastosM * 0.3; 
        const gastosDepurados = gastosM - ahorroPotencial;
        const mesesExtra = gastosDepurados > 0 ? (bache / gastosDepurados) : 0;

        document.getElementById('listaRecortes').innerHTML = `
            Para cubrir el rojo de <b>$${bache.toLocaleString()}</b> sugerimos:<br><br>
            • 🔴 <b>Ajuste Operativo (30%):</b> Ahorro de $${ahorroPotencial.toLocaleString()}/mes.<br>
            • 🔴 <b>Freno a Inversiones:</b> Bloquear $${(ahorroPotencial * 0.5).toLocaleString()} de partidas no críticas.
        `;
        document.getElementById('oxigenoCalculado').innerHTML = `✅ <b>EFECTO:</b> Aplicando este recorte, extendés tu supervivencia <b>${mesesExtra.toFixed(1)} meses</b>.`;
    } else {
        panelAjuste.style.display = 'none';
    }
}

async function conectarMes() {
    const mes = document.getElementById('mesFiltro').value;
    if (!mes) return;
    if (refMes) refMes.off();

    const [y, m] = mes.split('-').map(Number);
    const mAnt = m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`;
    
    const snapAnt = await db.ref(`tesoreria/meses/${mAnt}/cierre`).once('value');
    const arrastre = snapAnt.val() || 0;
    
    refMes = db.ref(`tesoreria/meses/${mes}`);
    refMes.on('value', snap => {
        const data = snap.val();
        datosMes = data || { bancos: { galicia: arrastre, santander: 0 }, gastos: {}, metadata: { creado: new Date().toISOString() } };
        
        document.getElementById('bancoGalicia').value = datosMes.bancos?.galicia ?? arrastre;
        document.getElementById('bancoSantander').value = datosMes.bancos?.santander ?? 0;
        
        proyectarTodo();
    });
}
// 1. FUNCIÓN PARA PROYECTAR Y RENDERIZAR SEMANAS
async function proyectarTodo() {
    try {
        const mesSeleccionado = document.getElementById('mesFiltro').value;
        if (!mesSeleccionado || !motorGlobal.inteligencia_cuit) return;

        const hoy = new Date();
        const mesActualStr = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;
        const diaActual = hoy.getDate();
        const semanaActual = Math.ceil(diaActual / 7);

        let saldoAcumulado = (parseFloat(document.getElementById('bancoGalicia').value) || 0) + 
                             (parseFloat(document.getElementById('bancoSantander').value) || 0);
        
        let ingS = { 1: 0, 2: 0, 3: 0, 4: 0 };
        let gasS = { 1: 0, 2: 0, 3: 0, 4: 0 };
        let detG = { 1: [], 2: [], 3: [], 4: [] };
        let acumuladorIngresos = { 1: {}, 2: {}, 3: {}, 4: {} };

        // Procesar Ingresos
        const inteligencia = motorGlobal.inteligencia_cuit;
        Object.keys(inteligencia).forEach(cuit => {
            const cliente = inteligencia[cuit];
            if (!cliente.facturas_pendientes) return;

            cliente.facturas_pendientes.forEach(f => {
                const fechaCobro = f.proximo_cobro_estimado;
                if (!fechaCobro) return;

                const [y, m, d] = fechaCobro.split('-').map(Number);
                const mesC = `${y}-${String(m).padStart(2, '0')}`;
                
                if (mesC === mesSeleccionado) {
                    const s = Math.min(Math.ceil(d / 7), 4);
                    const nombre = cliente.nombre_fantasia || "CLIENTE";
                    
                    if (!acumuladorIngresos[s][nombre]) acumuladorIngresos[s][nombre] = { monto: 0 };
                    acumuladorIngresos[s][nombre].monto += (f.monto || 0);
                    ingS[s] += (f.monto || 0);
                }
            });
        });

        // Procesar Gastos
        const snapGastos = await db.ref('configuracion/gastos_recurrentes').once('value');
        const gastosMaestros = snapGastos.val() || {};

        Object.keys(gastosMaestros).forEach(cat => {
            const rubro = gastosMaestros[cat];
            const itemsGasto = rubro.items ? Object.values(rubro.items) : [];
            
            itemsGasto.forEach(g => {
                if (g.desde && mesSeleccionado < g.desde) return; 
                if (g.hasta && mesSeleccionado > g.hasta) return;
                if (!g.monto || parseFloat(g.monto) <= 0) return;
                
                let sG = g.dia_pago ? Math.min(Math.ceil(parseInt(g.dia_pago) / 7), 4) : 1;
                const monto = parseFloat(g.monto);
                gasS[sG] += monto;
                
                // CORRECCIÓN APLICADA AQUÍ: Usa nombre_gasto, si no existe usa la categoría
                const nombreMostrar = (g.nombre_gasto && g.nombre_gasto.trim() !== "") ? g.nombre_gasto : cat;

                detG[sG].push(`
                <div style="display:flex; justify-content:space-between; font-size:10px; color:#fca5a5; margin-bottom:2px;">
                <span>📉 ${nombreMostrar.substring(0,8)}</span>
                <span>$${Math.round(monto/1000)}k</span>
                </div>
                `);
            });
        });

        window.ingresosSemanales = acumuladorIngresos;
        window.detallesSemanales = detG;

        // Renderizado
        const grid = document.getElementById('gridSemanas');
        if (grid) {
            grid.innerHTML = "";
            for (let i = 1; i <= 4; i++) {
                saldoAcumulado += (ingS[i] - gasS[i]);
                const esPasado = (mesSeleccionado < mesActualStr) || (mesSeleccionado === mesActualStr && i < semanaActual);
                const estiloFondo = esPasado ? "background: #0b0e14; opacity: 0.7; border-top: 3px solid #374151;" : `border-top: 3px solid ${saldoAcumulado < 0 ? 'var(--rojo)':'var(--verde)'};`;

                let htmlIngresos = Object.keys(acumuladorIngresos[i]).map(nombre => {
                    const pct = ingS[i] > 0 ? ((acumuladorIngresos[i][nombre].monto / ingS[i]) * 100).toFixed(0) : 0;
                    return `
                        <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:2px; align-items:center;">
                            <span title="${nombre}" style="${esPasado ? 'color:#4b5563' : 'color:var(--acento)'}; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:60px;">${nombre}</span>
                            <span style="opacity:0.5; font-size:8px;">${pct}%</span>
                            <span style="font-weight:bold;">$${Math.round(acumuladorIngresos[i][nombre].monto/1000)}k</span>
                        </div>`;
                }).join('');

                grid.innerHTML += `
                <div class="sem-card" style="${estiloFondo} background:#111827; padding:10px; border-radius:4px; cursor:pointer;" onclick="abrirDetalleSemana(${i}, ${Math.round(saldoAcumulado)})">
                    <div class="etiqueta-sem" style="font-size:10px; color:#94a3b8;">Semana ${i} ${esPasado ? '• CERRADA' : '• ACTIVA'}</div>
                    <div class="monto-semanal" style="font-size:16px; font-weight:bold; ${esPasado ? 'color:#4b5563' : (saldoAcumulado < 0 ? 'color:var(--rojo)' : 'color:var(--verde)')}">
                        $${Math.round(saldoAcumulado).toLocaleString()}
                    </div>
                    <div style="margin-top:10px; border-top: 1px solid #1f2937; padding-top: 10px;">
                        <div style="max-height:80px; overflow-y:auto;">${htmlIngresos}${detG[i].join('')}</div>
                    </div>
                </div>`;
            }
        }
        renderizarDashboardTopeDeGama();
    } catch (error) { console.error("Error:", error); }
}

    // --- FUNCIONES DE APOYO DEL MOTOR IA ---
    function parseFecha(s) { 
        if (!s) return null;
        if (s instanceof Date) return s;
        const sep = s.includes('/') ? '/' : '-';
        const p = s.split(sep);
        return p[0].length === 4 ? new Date(p[0], p[1] - 1, p[2]) : new Date(p[2], p[1] - 1, p[0]);
    }

    function limpiarOutliers(arr) { 
        if (arr.length < 4) return arr; 
        const temp = [...arr].sort((a, b) => a - b); 
        const inicio = Math.floor(temp.length * 0.1);
        const fin = Math.ceil(temp.length * 0.9);
        return temp.slice(inicio, fin); 
    }

    function mediaPonderada(arr) { 
        if (!arr || !arr.length) return 65; 
        return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length); 
    }

    // --- GENERADOR DE INFORMES ---
   async function generarInformeJunta() {
    // 1. Validación de seguridad
    if (!window.motorGlobal || !window.motorGlobal.inteligencia_cuit) {
        alert("⚠️ Motor no sincronizado. Ejecuta la Sincronización primero.");
        return;
    }

    // 2. Verificar si jsPDF existe
    if (typeof window.jspdf === 'undefined' && typeof jsPDF === 'undefined') {
        alert("❌ La librería jsPDF no está cargada. Verifica tu conexión a internet.");
        return;
    }

    const { jsPDF } = window.jspdf || window;
    const doc = new jsPDF();
    const data = window.motorGlobal;
    
    // Configuración estética
    const colorPrimario = [0, 0, 0];
    const colorAlerta = [200, 50, 50];

    // Título
    doc.setFontSize(22);
    doc.text("Reporte Ejecutivo de Tesorería", 20, 20);
    doc.setFontSize(10);
    doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 20, 30);
    doc.line(20, 35, 190, 35);
    
    // Cuerpo
    doc.setFontSize(12);
    doc.text(`Burn Rate Estructural: $${(data.reporte?.esperado || 0).toLocaleString()}`, 20, 45);
    doc.text(`Runway Estimado: ${data.reporte?.supervivencia || 0} días`, 20, 55);
    
    // Ajuste Inflación
    const factorInflacion = 0.05;
    const saldoNominal = data.reporte?.saldo_total || 0;
    const impactoInflacion = Math.round(saldoNominal * factorInflacion);
    
    doc.setTextColor(...colorAlerta);
    doc.text(`Impacto Estimado por Inflación (5%): -$${impactoInflacion.toLocaleString()}`, 20, 65);
    doc.setTextColor(...colorPrimario);
    
    // Top 3
    doc.setFontSize(14);
    doc.text("Top 3 Obras Sociales con mayor deuda:", 20, 85);
    
    const top3 = Object.keys(data.inteligencia_cuit)
        .sort((a, b) => (data.inteligencia_cuit[b].deuda_viva || 0) - (data.inteligencia_cuit[a].deuda_viva || 0))
        .slice(0, 3);
        
    let y = 95;
    top3.forEach((cuit, index) => {
        const d = data.inteligencia_cuit[cuit];
        doc.setFontSize(10);
        // Usamos substring para evitar que nombres ultra largos rompan el PDF
        const nombre = (d.nombre_fantasia || cuit).substring(0, 60);
        doc.text(`${index + 1}. ${nombre}: $${(d.deuda_viva || 0).toLocaleString()}`, 20, y);
        y += 10;
    });

    // Alertas
    doc.setFontSize(14);
    doc.text("⚠️ Alertas Críticas (Pagos Masivos):", 20, y + 10);
    
    let yAlertas = y + 20;
    let hayAlertas = false;

    Object.keys(data.inteligencia_cuit).forEach(cuit => {
        const d = data.inteligencia_cuit[cuit];
        if (d.alerta_analitica?.tiene_pagos_masivos) {
            doc.setFontSize(10);
            doc.text(`• ${d.nombre_fantasia || cuit}`, 20, yAlertas);
            yAlertas += 7;
            hayAlertas = true;
        }
    });

    if (!hayAlertas) {
        doc.setFontSize(10);
        doc.text("No se detectaron alertas críticas de pagos masivos.", 20, yAlertas);
    }

    // Descarga
    doc.save(`Informe_Junta_${new Date().getTime()}.pdf`);
}
    // --- GESTIÓN DE GASTOS Y BANCOS ---
    function nuevaCategoria() {
        const nombre = prompt("Nombre del rubro/gasto:");
        if (!nombre) return;

        const nuevoGasto = { 
            monto: 0, 
            desde: new Date().toISOString().slice(0, 7), 
            hasta: "" 
        };

        db.ref(`configuracion/gastos_recurrentes/${nombre}/items`).push(nuevoGasto)
          .then(() => { dibujarGastos(); if (typeof proyectarTodo === 'function') proyectarTodo(); });
    }
    // Agregamos un botón para "Agregar Item" dentro de una categoría existente
function agregarGastoAItem(cat) {
    const nuevoGasto = { 
        monto: 0, 
        desde: new Date().toISOString().slice(0, 7), 
        hasta: "", // Vacío significa "Sin fin"
        dia_pago: 1 // Para el impacto semanal
    };
    db.ref(`configuracion/gastos_recurrentes/${cat}/items`).push(nuevoGasto)
      .then(() => dibujarGastos());
}
    function guardarBancos() {
        const mes = document.getElementById('mesFiltro').value;
        const galicia = parseFloat(document.getElementById('bancoGalicia').value) || 0;
        const santander = parseFloat(document.getElementById('bancoSantander').value) || 0;

        db.ref(`tesoreria/meses/${mes}/bancos`).update({ galicia, santander }).then(() => {
            if (typeof verificarYEntrenar === 'function') verificarYEntrenar();
            if (typeof proyectarTodo === 'function') proyectarTodo();
        });
    }
    // --- CORRECCIÓN DE FUNCIONES ---
function dibujarGastos() {
    const cont = document.getElementById('contGastos');
    if (!cont) return;
    cont.innerHTML = "";
    
    db.ref('configuracion/gastos_recurrentes').once('value', snapshot => {
        const gastos = snapshot.val() || {};
        
        Object.keys(gastos).forEach(cat => {
            const rubro = gastos[cat];
            const itemsObj = rubro.items || {};
            let itemsHtml = "";

            Object.keys(itemsObj).forEach(key => {
                const it = itemsObj[key];
                itemsHtml += `
                <div style="display:grid; grid-template-columns: 1fr 60px 40px 30px; gap:4px; align-items:center;">
               <input type="text" ... style="min-width:0; background:#000; color:#fff; border:1px solid #444; padding:4px; font-size:11px;">
                </div>
                        <input type="text" placeholder="Nombre" value="${it.nombre_gasto || ''}" onchange="updateGastoRecurrente('${cat}', '${key}', 'nombre_gasto', this.value)" style="background:#000; color:#fff; border:1px solid #444; padding:4px; font-size:11px; border-radius:2px;">
                        <input type="number" placeholder="$" value="${it.monto || 0}" onchange="updateGastoRecurrente('${cat}', '${key}', 'monto', this.value)" style="background:#000; color:#fff; border:1px solid #444; padding:4px; font-size:11px; border-radius:2px;">
                        <input type="number" placeholder="Día" value="${it.dia_pago || 1}" onchange="updateGastoRecurrente('${cat}', '${key}', 'dia_pago', this.value)" style="background:#000; color:#fff; border:1px solid #444; padding:4px; font-size:11px; border-radius:2px;">
                        <button onclick="eliminarGastoRecurrente('${cat}', '${key}')" style="background:transparent; border:none; color:#ef4444; cursor:pointer; font-weight:bold;">✕</button>
                    </div>
                    <div style="display:flex; gap:4px; margin-top:5px;">
                        <input type="month" value="${it.desde || ''}" onchange="updateGastoRecurrente('${cat}', '${key}', 'desde', this.value)" style="flex:1; background:#000; color:#fff; border:1px solid #444; padding:2px; font-size:10px;">
                        <input type="month" value="${it.hasta || ''}" onchange="updateGastoRecurrente('${cat}', '${key}', 'hasta', this.value)" style="flex:1; background:#000; color:#fff; border:1px solid #444; padding:2px; font-size:10px;">
                    </div>
                </div>`;
            });

            cont.innerHTML += `
            <div style="margin-bottom:15px; border-left:3px solid var(--p); padding-left:10px; box-sizing:border-box;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                    <b style="color:var(--p); font-size:12px;">${cat}</b>
                    <button onclick="agregarGastoAItem('${cat}')" style="background:#3b82f6; border:none; color:white; border-radius:3px; padding:2px 8px; cursor:pointer; font-size:10px;">+ Item</button>
                </div>
                ${itemsHtml}
            </div>`;
        });
    });
}
   // Actualizada para recibir la 'key' real de Firebase
    function updateGastoRecurrente(cat, key, campo, valor) {
        if (campo === 'monto') valor = parseFloat(valor) || 0;
        db.ref(`configuracion/gastos_recurrentes/${cat}/items/${key}`).update({ [campo]: valor }).then(() => {
            if (typeof proyectarTodo === 'function') proyectarTodo();
        });
    }
function eliminarGastoRecurrente(cat, key) {
        if (confirm("¿Seguro que deseas eliminar este gasto?")) {
            db.ref(`configuracion/gastos_recurrentes/${cat}/items/${key}`).remove().then(() => {
                dibujarGastos();
                if (typeof proyectarTodo === 'function') proyectarTodo();
            });
        }
    }

window.onload = async () => {

    const hoy = new Date();
    const mesActual = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;
    const filtroMes = document.getElementById('mesFiltro');

// --- SINCRONIZACIÓN TOTAL ---
// Esta función ahora es tu "botón de pánico" o disparo manual de sincronización
async function sincronizacionTotal(event) {
    const btn = event?.target;
    if (!btn) return;
    
    const originalText = btn.innerText;
    btn.innerText = "⏳ PROCESANDO IA...";
    btn.disabled = true;
    
    try {
        // Obtenemos los datos necesarios
        const [fS, sS, cS, gS] = await Promise.all([
            db.ref('facturas_emitidas').once('value'),
            db.ref('facturas_emitidas_saei').once('value'),
            db.ref('cobranzas').once('value'),
            db.ref('configuracion/gastos_recurrentes').once('value')
        ]);
        
        // Disparamos la ejecución del motor
        if (typeof ejecutarIA === 'function') {
            await ejecutarIA({ ...(fS.val() || {}), ...(sS.val() || {}) }, cS.val() || {}, gS.val() || {});
        }
        
        // Al terminar, redibujamos el dashboard con los datos frescos
        if (typeof proyectarTodo === 'function') await proyectarTodo();
        
        btn.innerText = "✅ ¡LISTO!";
        btn.style.backgroundColor = "#10b981";
        setTimeout(() => { btn.innerText = originalText; btn.disabled = false; btn.style.backgroundColor = ""; }, 2500);
    } catch (e) {
        console.error("Error en sincronización:", e);
        btn.innerText = "❌ ERROR DE MOTOR";
        btn.disabled = false;
        setTimeout(() => { btn.innerText = originalText; }, 3000);
    }
}
