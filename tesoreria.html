function renderizarDashboardTopeDeGama() {
    const contenedor = document.getElementById('dashboardCompleto');
    if (!motorGlobal.inteligencia_cuit) {
        contenedor.innerHTML = `<div style="color:#666; text-align:center; padding:20px;">Esperando datos de Inteligencia...</div>`;

    }

    const cuits = Object.keys(motorGlobal.inteligencia_cuit).sort((a, b) => 
        (motorGlobal.inteligencia_cuit[b].deuda_viva || 0) - (motorGlobal.inteligencia_cuit[a].deuda_viva || 0)
    );

    let html = '';
    cuits.forEach(cuit => {
        const d = motorGlobal.inteligencia_cuit[cuit];
        const nombre = d.nombre_fantasia || cuit; // Usa el nombre si existe, sino el CUIT
        const tieneMasivos = d.alerta_analitica && d.alerta_analitica.tiene_pagos_masivos;
        const colorBorde = tieneMasivos ? 'var(--oro)' : (d.delay_estimado > 60 ? 'var(--rojo)' : 'var(--verde)');
        
        html += `
        <div class="tarjeta-cliente" style="border-left: 4px solid ${colorBorde}; background:#111827; padding:10px; margin-bottom:10px; border-radius:0 8px 8px 0;">
            <input type="checkbox" class="selector-cliente checkbox-riesgo" value="${cuit}" data-deuda="${d.deuda_viva || 0}">
            <div style="padding-left: 25px; margin-top:-20px;">
                <h4 style="color:var(--acento); margin:0 0 2px 0; font-size:13px;">${nombre}</h4>
                <div style="font-size:10px; color:#666; margin-bottom:5px;">CUIT: ${cuit}</div>
                <span style="font-size:9px; padding:2px 6px; background:#000; border-radius:3px; color:var(--oro);">${d.patron || 'Sin patrón'}</span>
            </div>
            <div style="font-size: 11px; margin-top:10px; border-top: 1px solid #1f2937; padding-top: 8px;">
                <div style="display:flex; justify-content:space-between; margin-bottom: 4px;">
                    <span style="color:#94a3b8">Deuda Viva:</span>
                    <b style="font-size:12px">$${(d.deuda_viva || 0).toLocaleString()}</b>
                </div>
                <div style="display:flex; justify-content:space-between;">
                    <span style="color:#94a3b8">Delay Est:</span>
                    <b style="color:${d.delay_estimado > 60 ? 'var(--rojo)' : 'var(--texto)'}">${d.delay_estimado || 0} días</b>
                </div>
                ${tieneMasivos ? `<div style="margin-top:8px; padding:4px; background:rgba(245, 158, 11, 0.1); border-left:2px solid var(--oro); font-size:9px; color:var(--oro);">⚠️ Pago masivo detectado</div>` : ''}
            </div>
        </div>`;
    });
    contenedor.innerHTML = html;
}
async function ejecutarStressTest() {
        const seleccionados = document.querySelectorAll('.selector-cliente:checked');
        let impactoTotal = 0;
        seleccionados.forEach(chk => impactoTotal += parseFloat(chk.dataset.deuda || 0));

        if (seleccionados.length === 0) {
            alert("Seleccioná al menos un cliente del panel inferior para simular un impago.");
            return;
        }

        // Usamos el reporte real del motor o fallback a 0
        const saldoActual = motorGlobal.reporte?.esperado || 0;
        const nuevoSaldo = saldoActual - impactoTotal;
        
        // Mantenemos la variable global, pero garantizamos que sea un número válido
        const gastosM = window.totalGastosProyectados > 0 ? window.totalGastosProyectados : 500000; 
        
        const resStress = document.getElementById('resStress');
        const panelAjuste = document.getElementById('panelAjuste');
        
        resStress.innerHTML = `
            <div>Pérdida de flujo proyectado: <b style="color:var(--oro)">-$${impactoTotal.toLocaleString()}</b></div>
            <div style="margin-top:5px; padding-top:5px; border-top:1px solid rgba(255,255,255,0.2);">
                Nuevo estado de caja: <b style="color:${nuevoSaldo < 0 ? 'var(--rojo)' : 'var(--verde)'};">$${nuevoSaldo.toLocaleString()}</b>
            </div>
        `;

        if (nuevoSaldo < 0) {
            panelAjuste.style.display = 'block';
            const bache = Math.abs(nuevoSaldo);
            const ahorroPotencial = gastosM * 0.3; 
            const gastosDepurados = gastosM - ahorroPotencial;
            const mesesExtra = gastosDepurados > 0 ? (bache / gastosDepurados) : 0;

            document.getElementById('listaRecortes').innerHTML = `
                Para cubrir el rojo de <b>$${bache.toLocaleString()}</b> sugerimos:<br><br>
                • 🔴 <b>Ajuste Operativo (30%):</b> Ahorro de $${ahorroPotencial.toLocaleString()}/mes.<br>
                • 🔴 <b>Freno a Inversiones:</b> Bloquear $${(ahorroPotencial * 0.5).toLocaleString()} de partidas no críticas.
            `;
            document.getElementById('oxigenoCalculado').innerHTML = `✅ <b>EFECTO:</b> Aplicando este recorte, extendés tu supervivencia <b>${mesesExtra.toFixed(1)} meses</b>.`;
        } else {
            panelAjuste.style.display = 'none';
        }
    }

    async function conectarMes() {
        const mes = document.getElementById('mesFiltro').value;
        if (!mes) return;
        if (refMes) refMes.off();

        // 1. Cálculo de Arrastre (Mes Anterior)
        const [y, m] = mes.split('-').map(Number);
        const mAnt = m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`;
        
        const snapAnt = await db.ref(`tesoreria/meses/${mAnt}/cierre`).once('value');
        const arrastre = snapAnt.val() || 0;
        
        const infoArrastre = document.getElementById('infoArrastre');
        if (infoArrastre) {
            infoArrastre.innerText = `⚠ Arrastre de ${mAnt}: $${Math.round(arrastre).toLocaleString()}`;
        }

        // 2. Conexión a Mes Actual con Protección de Datos
        refMes = db.ref(`tesoreria/meses/${mes}`);
        refMes.on('value', snap => {
            const data = snap.val();
            datosMes = data || { bancos: { galicia: arrastre, santander: 0 }, gastos: {}, metadata: { creado: new Date().toISOString() } };
            
            // Actualización de inputs con seguridad
            document.getElementById('bancoGalicia').value = datosMes.bancos?.galicia ?? arrastre;
            document.getElementById('bancoSantander').value = datosMes.bancos?.santander ?? 0;
            
            if (typeof dibujarGastos === 'function') dibujarGastos(); 
            proyectarTodo(); // <-- Aquí es donde la nave recalcula todo con el nuevo valor
        });
    }
async function proyectarTodo() {

    const semanaActual = Math.ceil(diaActual / 7);

    let saldoAcumulado = (parseFloat(document.getElementById('bancoGalicia').value) || 0) + 
                         (parseFloat(document.getElementById('bancoSantander').value) || 0);
    
    let ingS = { 1: 0, 2: 0, 3: 0, 4: 0 };

            if (!fechaCobro) return;

            const [y, m, d] = fechaCobro.split('-').map(Number);
            const mesC = `${y}-${String(m).padStart(2, '0')}`;
            
            if (mesC === mesSeleccionado) {
                const s = Math.min(Math.ceil(d / 7), 4);
                const nombre = cliente.nombre_fantasia || "CLIENTE";
                
                if (!acumuladorIngresos[s][nombre]) acumuladorIngresos[s][nombre] = { monto: 0 };
                acumuladorIngresos[s][nombre].monto += (f.monto || 0);
                ingS[s] += (f.monto || 0);
            }
        });
    });

    // 2. PROCESAR GASTOS
    // 2. PROCESAR GASTOS
const snapGastos = await db.ref('configuracion/gastos_recurrentes').once('value');
const gastosMaestros = snapGastos.val() || {};
const mesActual = document.getElementById('mesFiltro').value;

Object.keys(gastosMaestros).forEach(cat => {
    const rubro = gastosMaestros[cat]; // accedemos a la categoría
    
    (rubro.items || []).forEach(g => {
        // 1. VALIDACIÓN DE FECHAS (PLAZO)
        if (g.desde && mesActual < g.desde) return; 
        if (g.hasta && mesActual > g.hasta) return; // Si 'hasta' existe y ya pasó el mes, ignoramos
        
        // 2. VALIDACIÓN DE MONTO
        if (!g.monto || parseFloat(g.monto) <= 0) return;
        
        // 3. DETERMINAR SEMANA (sG)
        // Usamos g.dia_pago (asumiendo que viene del item)
        let sG = g.dia_pago ? Math.min(Math.ceil(g.dia_pago / 7), 4) : 1;
        
        // 4. ACUMULACIÓN
        const monto = parseFloat(g.monto);
        gasS[sG] += monto;
        saldoAcumulado -= monto;
        
        // 5. DETALLE PARA EL MODAL
        detG[sG].push(`
            <div style="display:flex; justify-content:space-between; font-size:10px; color:#fca5a5;">
                <span>📉 ${rubro.nombre ? rubro.nombre.substring(0,8) : 'Gasto'}</span>
                <span>$${Math.round(monto/1000)}k</span>
            </div>
        `);
    });
});

    // 3. RENDERIZADO VISUAL CON LOGICA DE SEMANAS PASADAS
    const grid = document.getElementById('gridSemanas');
    if (grid) {
        grid.innerHTML = "";
        for (let i = 1; i <= 4; i++) {
            saldoAcumulado += (ingS[i] - gasS[i]);
            
            // Lógica: Si el mes ya pasó O (es el mes actual y la semana ya pasó)
            const esPasado = (mesSeleccionado < mesActualStr) || (mesSeleccionado === mesActualStr && i < semanaActual);
            const estiloFondo = esPasado ? "background: #0b0e14; opacity: 0.7; border-top: 3px solid #374151;" : `border-top: 3px solid ${saldoAcumulado < 0 ? 'var(--rojo)':'var(--verde)'};`;
            const estiloTexto = esPasado ? "color: #6b7280;" : "";

            let htmlIngresos = Object.keys(acumuladorIngresos[i]).map(nombre => `
                <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:2px;">
                    <span style="${esPasado ? 'color:#4b5563' : 'color:var(--acento)'}">${nombre.substring(0,10)}</span>
                    <span>$${Math.round(acumuladorIngresos[i][nombre].monto/1000)}k</span>
                </div>`).join('');

		grid.innerHTML += `
    <div class="sem-card" style="${estiloFondo}" 
         onclick="abrirDetalleSemana(${i}, ${Math.round(saldoAcumulado)}, '${JSON.stringify(acumuladorIngresos[i]).replace(/"/g, "'")}', [${detG[i].map(d => `'${d}'`)}])">
        
        <div class="etiqueta-sem">Semana ${i} ${esPasado ? '• CERRADA' : '• ACTIVA'}</div>
        <div class="monto-semanal" style="${esPasado ? 'color:#4b5563' : (saldoAcumulado < 0 ? 'color:var(--rojo)' : 'color:var(--verde)')}">
            $${Math.round(saldoAcumulado).toLocaleString()}
        </div>
        
        <div style="margin-top:10px; border-top: 1px solid #1f2937; padding-top: 10px;">
            <div style="max-height:100px; overflow-y:auto; padding-right:5px;">
                ${htmlIngresos}
                ${detG[i].join('')}
            </div>
        </div>
    </div>`;            
    
    }
    
}
        window.totalGastosProyectados = Object.values(gasS).reduce((a,b) => a+b, 0);
}

// --- FUNCIONES DE APOYO DEL MOTOR IA (NO BORRAR) ---
function parseFecha(s) { 
    if (!s) return null;
    if (s instanceof Date) return s;
    const sep = s.includes('/') ? '/' : '-';
    const p = s.split(sep);
    return p[0].length === 4 ? new Date(p[0], p[1] - 1, p[2]) : new Date(p[2], p[1] - 1, p[0]);
}

function limpiarOutliers(arr) { 
    if (arr.length < 4) return arr; 
    const temp = [...arr].sort((a, b) => a - b); 
    const inicio = Math.floor(temp.length * 0.1);
    const fin = Math.ceil(temp.length * 0.9);
    return temp.slice(inicio, fin); 
}

function mediaPonderada(arr) { 
    if (!arr || !arr.length) return 65; 
    return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length); 
}

// --- GENERADOR DE INFORMES (NUEVO) ---
async function generarInformeJunta() {
    if (!window.motorGlobal || !window.motorGlobal.inteligencia_cuit) {
        alert("⚠️ Motor no sincronizado. Ejecuta la Sincronización primero.");
        return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const data = window.motorGlobal;
    
    // Configuración de ajuste (puedes parametrizar esto según el índice mensual)
    const factorInflacion = 0.05; // Ajuste del 5% mensual como ejemplo

    // Encabezado
    doc.setFontSize(22);
    doc.text("Reporte Ejecutivo de Tesorería", 20, 20);
    doc.setFontSize(10);
    doc.text(`Fecha: ${new Date().toLocaleDateString()}`, 20, 30);
    doc.line(20, 35, 190, 35);
    
    // KPIs Globales y Ajuste Real
    doc.setFontSize(12);
    doc.text(`Burn Rate Estructural: $${data.reporte?.esperado?.toLocaleString() || 0}`, 20, 45);
    doc.text(`Runway Estimado: ${data.reporte?.supervivencia || 0} días`, 20, 55);
    
    // Bloque de Pérdida por Inflación
    const saldoNominal = data.reporte?.saldo_total || 0;
    const impactoInflacion = Math.round(saldoNominal * factorInflacion);
    doc.setTextColor(200, 50, 50); // Rojo para pérdida
    doc.text(`Impacto Estimado por Inflación (Ajuste): -$${impactoInflacion.toLocaleString()}`, 20, 65);
    doc.setTextColor(0, 0, 0); // Reset color
    
    // Tabla de Top 3 Deudores
    doc.setFontSize(14);
    doc.text("Top 3 Obras Sociales con mayor deuda:", 20, 85);
    
    const top3 = Object.keys(data.inteligencia_cuit)
        .sort((a, b) => data.inteligencia_cuit[b].deuda_viva - data.inteligencia_cuit[a].deuda_viva)
        .slice(0, 3);
        
    let y = 95;
    top3.forEach((cuit, index) => {
        const d = data.inteligencia_cuit[cuit];
        doc.setFontSize(10);
        doc.text(`${index + 1}. ${d.nombre_fantasia || cuit}: $${(d.deuda_viva || 0).toLocaleString()}`, 20, y);
        y += 10;
    });

    // Seccion de Alertas
    doc.setFontSize(14);
    doc.text("⚠️ Alertas Críticas (Pagos Masivos):", 20, y + 10);
    
    let yAlertas = y + 20;
    let hayAlertas = false;

    Object.keys(data.inteligencia_cuit).forEach(cuit => {
        const d = data.inteligencia_cuit[cuit];
        if (d.alerta_analitica && d.alerta_analitica.tiene_pagos_masivos) {
            doc.setFontSize(10);
            doc.text(`• ${d.nombre_fantasia || cuit} presenta patrones de pagos masivos.`, 20, yAlertas);
            yAlertas += 7;
            hayAlertas = true;
        }
    });

    if (!hayAlertas) {
        doc.text("No se detectaron alertas críticas de pagos masivos.", 20, yAlertas);
    }

    doc.save(`Informe_Junta_Completo_${new Date().getTime()}.pdf`);
}
// --- PROCESO DE ENTRENAMIENTO DINÁMICO ---
async function verificarYEntrenar() {
    const [fSnap, sSnap, gSnap] = await Promise.all([
        db.ref('facturas_emitidas').once('value'),
        db.ref('facturas_emitidas_saei').once('value'),
        db.ref('configuracion/gastos_recurrentes').once('value')
    ]);
    
    const facturas = { ...(fSnap.val() || {}), ...(sSnap.val() || {}) };
    const gastosMaestros = gSnap.val() || {};
    const cantidadActual = Object.keys(facturas).length;
    const motorSnap = await db.ref('tesoreria/motor_ia').once('value');
    const motorData = motorSnap.val() || { cantidad_entrenada: 0 };

    if (cantidadActual !== motorData.cantidad_entrenada) {
        const statusIA = document.getElementById('statusIA');
        if (statusIA) statusIA.innerText = "🤖 IA: Analizando cobros y gastos...";
        const cSnap = await db.ref('cobranzas').once('value');
        try {
            await ejecutarIA(facturas, cSnap.val() || {}, gastosMaestros);
            await db.ref('tesoreria/motor_ia').update({ 
                cantidad_entrenada: cantidadActual, 
                ultima_sincro: new Date().toLocaleString("es-AR"),
                estado: "optimizado"
            });
            if (statusIA) statusIA.innerText = "✅ Motor Sincronizado";
            if (typeof proyectarTodo === 'function') proyectarTodo();
        } catch (error) {
            console.error("❌ Error IA:", error);
            if (statusIA) statusIA.innerText = "⚠️ Error en Sincronización";
        }
    } else {
        const statusIA = document.getElementById('statusIA');
        if (statusIA) statusIA.innerText = "✅ Motor al día";
    }
}

// --- GESTIÓN DE GASTOS Y BANCOS ---
function nuevaCategoria() {
    const nombre = prompt("Nombre del rubro/gasto:");
    if (!nombre) return;

    const nuevoGasto = { 
        monto: 0, 
        desde: new Date().toISOString().slice(0, 7), 
        hasta: "" 
    };

    db.ref(`configuracion/gastos_recurrentes/${nombre}/items`).push(nuevoGasto)
      .then(() => { dibujarGastos(); if (typeof proyectarTodo === 'function') proyectarTodo(); });
}

function guardarBancos() {
    const mes = document.getElementById('mesFiltro').value;
    const galicia = parseFloat(document.getElementById('bancoGalicia').value) || 0;
    const santander = parseFloat(document.getElementById('bancoSantander').value) || 0;

    db.ref(`tesoreria/meses/${mes}/bancos`).update({ galicia, santander }).then(() => {
        if (typeof verificarYEntrenar === 'function') verificarYEntrenar();
        if (typeof proyectarTodo === 'function') proyectarTodo();
    });
}

function dibujarGastos() {
    const cont = document.getElementById('contGastos');
    if (!cont) return;
    cont.innerHTML = "";
    const mesSeleccionado = document.getElementById('mesFiltro').value;

    db.ref('configuracion/gastos_recurrentes').once('value', snapshot => {
        const gastos = snapshot.val() || {};
        Object.keys(gastos).forEach(cat => {
            const rubro = gastos[cat];
            let itemsHtml = "";
            
            (rubro.items || []).forEach((it, i) => {
                if (it.desde && mesSeleccionado < it.desde) return;
                if (it.hasta && mesSeleccionado > it.hasta) return;

                itemsHtml += `
                    <div style="display:flex; gap:5px; margin-bottom:8px; align-items:center;">
                        <input type="number" value="${it.monto || 0}" onchange="updateGastoRecurrente('${cat}', '${i}', 'monto', this.value)" style="width:70px;">
                        <input type="month" value="${it.desde || ''}" onchange="updateGastoRecurrente('${cat}', '${i}', 'desde', this.value)" title="Inicio">
                        <input type="month" value="${it.hasta || ''}" onchange="updateGastoRecurrente('${cat}', '${i}', 'hasta', this.value)" title="Fin (vacio=indefinido)">
                        <button onclick="eliminarGastoRecurrente('${cat}', '${i}')" style="background:transparent; border:none; color:var(--rojo); cursor:pointer;">✕</button>
                    </div>
                `;
            });

            cont.innerHTML += `
                <div style="margin-bottom:15px; border-bottom:1px solid #374151; padding-bottom:10px;">
                    <div style="font-weight:bold; color:var(--acento); margin-bottom:5px;">${cat}</div>
                    ${itemsHtml}
                </div>
            `;
        });
    });
}

function updateGastoRecurrente(cat, idx, campo, valor) {
    if (campo === 'monto') valor = parseFloat(valor) || 0;
    db.ref(`configuracion/gastos_recurrentes/${cat}/items/${idx}`).update({ [campo]: valor }).then(() => {
        if (typeof proyectarTodo === 'function') proyectarTodo();
    });
}

function eliminarGastoRecurrente(cat, idx) {
    if(!confirm(`¿Eliminar este gasto de ${cat}?`)) return;
    const ref = db.ref(`configuracion/gastos_recurrentes/${cat}/items`);
    ref.once('value', snap => {
        let items = snap.val() || [];
        items.splice(idx, 1);
        items.length === 0 ? db.ref(`configuracion/gastos_recurrentes/${cat}`).remove() : ref.set(items);
    }).then(() => { dibujarGastos(); if (typeof proyectarTodo === 'function') proyectarTodo(); });
}
async function simularImpacto() {
    const montoSimulado = parseFloat(document.getElementById('simMonto').value) || 0;
    const mesesSimulados = parseInt(document.getElementById('simMeses').value) || 1;
    const res = document.getElementById('resSim');
    if (!res) return;

    // Obtenemos datos del motor "encendido"
    const motorData = window.motorGlobal || {};
    
    // Si el motor ya hizo Montecarlo, usamos el "var_pesimista" como punto de partida 
    // real del peor escenario detectado por la IA.
    let saldoPesimista = motorData.var_pesimista || 0;
    
    // Sumamos bancos reales por si el VaR es solo proyección de flujos
    const saldoActual = (parseFloat(document.getElementById('bancoGalicia').value) || 0) + 
                        (parseFloat(document.getElementById('bancoSantander').value) || 0);
    
    let tempSaldo = saldoActual + saldoPesimista;
    const burnRate = motorData.burn_rate || 0;
    
    // En el peor escenario, el gasto mensual es la suma del burn actual 
    // + el impacto del nuevo proyecto/gasto que estás simulando.
    const gastoMensualPesimista = montoSimulado + burnRate;
    
    let mesesResistidos = 0;
    let quiebraEn = 0;

    for (let i = 1; i <= mesesSimulados; i++) {
        tempSaldo -= gastoMensualPesimista;
        if (tempSaldo < 0 && quiebraEn === 0) {
            quiebraEn = i;
        }
    }

    const esViable = quiebraEn === 0;
    res.style.color = esViable ? "#10b981" : "#ef4444";
    
    if (esViable) {
        res.innerText = `✅ ESCENARIO PESIMISTA: Titanium confirma soporte por ${mesesSimulados} meses. Saldo final: $${Math.round(tempSaldo).toLocaleString()}`;
    } else {
        res.innerText = `🚨 ALERTA: Bajo condiciones pesimistas (Montecarlo), quiebra técnica en el mes ${quiebraEn}.`;
    }
}
// --- INICIALIZACIÓN "VIVA" ---
window.onload = async () => {
    // Sincronización automática de fecha
    const hoy = new Date();
    const mesActual = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}`;
    const filtroMes = document.getElementById('mesFiltro');
    if (filtroMes) filtroMes.value = mesActual;

    // Conexión y entrenamiento inicial
    if (typeof conectarMes === 'function') await conectarMes();
    if (typeof verificarYEntrenar === 'function') await verificarYEntrenar();

    // Watchdog: Verifica la salud del motor cada 60 segundos
    setInterval(async () => {
        if (typeof verificarYEntrenar === 'function') await verificarYEntrenar();
    }, 60000);
};

// --- SINCRONIZACIÓN TOTAL ---
async function sincronizacionTotal(event) {
    const btn = event?.target;
    if (!btn) return;
    
    const originalText = btn.innerText;
    btn.innerText = "⏳ PROCESANDO IA...";
    btn.disabled = true;
    
    try {
        const [fS, sS, cS, gS] = await Promise.all([
            db.ref('facturas_emitidas').once('value'),
            db.ref('facturas_emitidas_saei').once('value'),
            db.ref('cobranzas').once('value'),
            db.ref('configuracion/gastos_recurrentes').once('value')
        ]);
        
        if (typeof ejecutarIA === 'function') {
            await ejecutarIA({ ...(fS.val() || {}), ...(sS.val() || {}) }, cS.val() || {}, gS.val() || {});
        }
        
        if (typeof proyectarTodo === 'function') await proyectarTodo();
        
        btn.innerText = "✅ ¡LISTO!";
        btn.style.backgroundColor = "#10b981";
        setTimeout(() => { btn.innerText = originalText; btn.disabled = false; btn.style.backgroundColor = ""; }, 2500);
    } catch (e) {
        btn.innerText = "❌ ERROR DE MOTOR";
        btn.disabled = false;
        setTimeout(() => { btn.innerText = originalText; }, 3000);
    }
}
