    // 2. CONECTAR MES Y ARRASTRE
    async function conectarMes() {

            } else {
                document.getElementById('bancoGalicia').value = arrastre;
                document.getElementById('bancoSantander').value = 0;
                datosMes = { bancos: {galicia: arrastre, santander:0}, gastos: {} };

            dibujarGastos();

    // 3. PROYECCIÓN BASADA EN COBRANZAS PENDIENTES (TU FLUJO)
async function proyectarTodo() {
    const mesSeleccionado = document.getElementById('mesFiltro').value;
    if (!mesSeleccionado) return;

    let saldo = (parseFloat(document.getElementById('bancoGalicia').value) || 0) + (parseFloat(document.getElementById('bancoSantander').value) || 0);
    let ingS = { 1: 0, 2: 0, 3: 0, 4: 0 }, gasS = { 1: 0, 2: 0, 3: 0, 4: 0 };
    
    const [snapFacts, snapSaei, snapCobros, snapGastos] = await Promise.all([
        db.ref('facturas_emitidas').once('value'),
        db.ref('facturas_emitidas_saei').once('value'),
        db.ref('cobranzas').once('value'),
        db.ref('configuracion/gastos_recurrentes').once('value')
    ]);

    const todasLasFacturas = { ...(snapFacts.val() || {}), ...(snapSaei.val() || {}) };
    const cobranzas = snapCobros.val() || {};
    const gastosMaestros = snapGastos.val() || {};

    // --- CAMBIO CLAVE AQUÍ: Usamos las variables del motor entrenado ---
    const delayIA = motorGlobal.inteligencia_cobro?.delay_entrenado_dias || motorGlobal.delay_historico || 65;
    const indiceIA = motorGlobal.clinica?.indice_cobranza || motorGlobal.indice_cobranza || 0.85;

    Object.keys(todasLasFacturas).forEach(id => {
        const f = todasLasFacturas[id];
        // Si el ID es el nodo raíz 'saei' o ya tiene fecha de pago, saltar
        if (id === 'saei' || (cobranzas[id] && cobranzas[id].fecha_pago)) return;

        let fechaBase = f.fecha_emision || f.fecha || f.fecha_peticion;
        if (!fechaBase) return;

        let partes = fechaBase.includes('/') ? fechaBase.split('/') : fechaBase.split('-');
        let fCobro = fechaBase.includes('/') ? new Date(partes[2], partes[1]-1, partes[0]) : new Date(partes[0], partes[1]-1, partes[2]);
        
        // Aplicamos el delay exacto que aprendió el motor
        fCobro.setDate(fCobro.getDate() + delayIA);
        const mesCobro = fCobro.toISOString().slice(0, 7);

        if (mesCobro === mesSeleccionado) {
            const s = Math.min(Math.ceil(fCobro.getDate() / 7), 4);
            // Aplicamos la efectividad de cobro real
            const montoProyectado = parseFloat(f.total || f.monto || 0) * indiceIA;
            ingS[s] += montoProyectado;
        }
    });

    Object.values(gastosMaestros).forEach(rubro => {
        if (rubro.items) {
            rubro.items.forEach(i => {
                const inicia = !i.desde || mesSeleccionado >= i.desde;
                const termina = !i.hasta || mesSeleccionado <= i.hasta;
                if (inicia && termina) {
                    const s = parseInt(i.semana) || 1;
                    gasS[s] += (parseFloat(i.monto) || 0);
                }
            });
        }
    });

    const grid = document.getElementById('gridSemanas');
    grid.innerHTML = "";
    for (let i = 1; i <= 4; i++) {
        saldo += (ingS[i] - gasS[i]);
        grid.innerHTML += `
            <div class="sem-card" style="border-color:${saldo < 0 ? 'var(--rojo)':'var(--verde)'}">
                <span style="font-size:9px">SEM ${i}</span>
                <b class="monto-final" style="color:${saldo < 0 ? 'var(--rojo)':'white'}">$${Math.round(saldo).toLocaleString()}</b>
                <div style="display:flex; justify-content:space-between; font-size:9px; margin-top:5px;">
                    <span style="color:var(--verde)">+ $${Math.round(ingS[i]/1000)}k</span>
                    <span style="color:var(--rojo)">- $${Math.round(gasS[i]/1000)}k</span>
                </div>
            </div>`;
    }

    saldoFinalProyectado = saldo; 

    db.ref(`tesoreria/meses/${mesSeleccionado}/cierre`).set(saldo);
    actualizarBannerDinamico(mesSeleccionado);
}

    // --- ENTRENAMIENTO Y MANTENIMIENTO ---
 // --- FUNCIONES DE APOYO DEL MOTOR IA ---
function parseFecha(s) { 
    if (!s) return null;
    // Si ya es un objeto Date, lo devolvemos tal cual
    if (s instanceof Date) return s;
    
    // Soporta formatos DD/MM/YYYY y YYYY-MM-DD
    const p = s.includes('/') ? s.split('/') : s.split('-'); 
    return s.includes('/') ? 
        new Date(p[2], p[1] - 1, p[0]) : 
        new Date(p[0], p[1] - 1, p[2]); 
}

function limpiarOutliers(arr) { 
    // Si tenemos pocos datos, no tiene sentido recortar extremos
    if (arr.length < 4) return arr; 
    
    // Ordenamos de menor a mayor
    arr.sort((a, b) => a - b); 
    
    // Eliminamos el 10% de los casos más rápidos y el 10% de los más lentos
    // Esto quita "ruido" de pagos excepcionales o deudas incobrables
    return arr.slice(Math.floor(arr.length * 0.1), Math.ceil(arr.length * 0.9)); 
}

function mediaPonderada(arr) { 
    // Si no hay datos, devolvemos el estándar de la industria (65 días)
    if (!arr || !arr.length) return 65; 
    
    // Calculamos el promedio simple sobre la lista ya filtrada
    const sum = arr.reduce((a, b) => a + b, 0); 
    return Math.round(sum / arr.length); 
}
   async function verificarYEntrenar() {
    // 1. CAPTURA TOTAL DE DATOS (Facturas de ambos pulmones + Gastos Maestros)
    const [fSnap, sSnap, gSnap] = await Promise.all([
        db.ref('facturas_emitidas').once('value'),
        db.ref('facturas_emitidas_saei').once('value'),
        db.ref('configuracion/gastos_recurrentes').once('value') // <--- Nuevo: La IA ahora mira los gastos fijos
    ]);
    
    const facturas = { ...(fSnap.val() || {}), ...(sSnap.val() || {}) };
    const gastosMaestros = gSnap.val() || {};
    const cantidadActual = Object.keys(facturas).length;
    
    // 2. VERIFICACIÓN DE ESTADO DEL MOTOR
    const motorSnap = await db.ref('tesoreria/motor_ia').once('value');
    const motorData = motorSnap.val() || { cantidad_entrenada: 0 };

    // Solo entrenamos si hay facturas nuevas o si queremos forzar el aprendizaje del flujo de gastos
    if (cantidadActual !== motorData.cantidad_entrenada) {
        document.getElementById('statusIA').innerText = "🤖 IA: Analizando cobros y gastos fijos...";
        
        // Traemos el historial de cobranzas real
        const cSnap = await db.ref('cobranzas').once('value');
        const cobranzas = cSnap.val() || {};
        
        // 3. EJECUCIÓN DEL APRENDIZAJE
        // Pasamos facturas, cobranzas y ahora también la estructura de gastos
        await ejecutarIA(facturas, cobranzas, gastosMaestros);
        
        // 4. ACTUALIZACIÓN DE METADATOS
        await db.ref('tesoreria/motor_ia').update({ 
            cantidad_entrenada: cantidadActual, 
            ultima_sincro: new Date().toLocaleString(),
            estado: "optimizado"
        });
        
        document.getElementById('statusIA').innerText = "✅ Motor Sincronizado";
        
        // Refrescamos la proyección con los nuevos parámetros aprendidos
        proyectarTodo(); 
    } else {
        document.getElementById('statusIA').innerText = "✅ Motor al día";
    }
}
async function ejecutarIA(f, c, g) {
    let delays = []; 
    let cobradas = 0; 
    let emitidas = Object.keys(f).length;
    let burnRateMensual = 0;

    // 1. ANÁLISIS DE COBRANZAS (Cálculo de eficiencia)
    Object.keys(f).forEach(id => {
        const fact = f[id];
        if (c[id] && c[id].fecha_pago) {
            const fEmi = parseFecha(fact.fecha_emision || fact.fecha || fact.fecha_peticion);
            const fPag = parseFecha(c[id].fecha_pago);
            if (fEmi && fPag) {
                const diff = Math.floor((fPag - fEmi) / 86400000);
                if (diff >= 0 && diff < 200) delays.push(diff);
                cobradas++;
            }
        }
    });

    // 2. CÁLCULOS ESTADÍSTICOS
    const delayFinal = mediaPonderada(limpiarOutliers(delays));
    const indiceCobranza = emitidas > 0 ? (cobradas / emitidas) : 0.85;

    // 3. ANÁLISIS DE GASTOS Y STRESS TEST
    Object.values(g || {}).forEach(rubro => {
        if (rubro.items) {
            rubro.items.forEach(i => { if (!i.hasta) burnRateMensual += (parseFloat(i.monto) || 0); });
        }
    });

    // --- AQUÍ EMPIEZA LA MAGIA: TOMA DE DECISIONES ---
    
    // Simulamos un escenario de Stress: ¿Qué pasa si cobramos solo el 70%?
    const saldoActual = (parseFloat(document.getElementById('bancoGalicia')?.value) || 0) + (parseFloat(document.getElementById('bancoSantander')?.value) || 0);
    const riesgoQuiebra = saldoActual < (burnRateMensual * 0.5); // Si no cubrimos ni medio mes de gastos fijos
    
    const escenario_stress = {
        resiste: !riesgoQuiebra,
        alertaCEO: riesgoQuiebra ? "RIESGO DE LIQUIDEZ INMEDIATO" : "FLUJO CONTROLADO",
        saldoFinalStress: saldoActual - burnRateMensual,
        fechaPeligro: riesgoQuiebra ? "Próximos 15 días" : "Sin riesgo a la vista"
    };

    // Calculamos Oportunidades (Si sobra más de un 20% del burn rate)
    const excedente = saldoActual - (burnRateMensual * 1.2);
    const oportunidades = {
        monto_sugerido: excedente > 500000 ? Math.round(excedente) : 0,
        instrumento: "FCI Galicia / Money Market",
        alerta_inflacion: "Inflación proyectada estable. No dejar pesos quietos.",
        consejo_uva: "Usa fondos con rescate inmediato por si surge una emergencia."
    };

    // 4. GUARDADO COMPLETO EN FIREBASE
    const dataUpdate = {
        delay_historico: delayFinal,
        indice_cobranza: indiceCobranza,
        burn_rate_fijo: burnRateMensual,
        salud_financiera: riesgoQuiebra ? "CRÍTICO" : "ESTABLE",
        escenario_stress: escenario_stress, // <--- Esto hace que salga el cartel rojo
        oportunidades: oportunidades,       // <--- Esto hace que salga el cartel verde
        ultima_actualizacion: new Date().toISOString()
    };

    await db.ref('tesoreria/motor_ia').update(dataUpdate);

    // Actualizamos variables locales
    motorGlobal = { ...motorGlobal, ...dataUpdate };
    
    console.log("🚀 Motor IA: Decisiones actualizadas en Firebase");
}
       function dibujarGastos() {
    const cont = document.getElementById('contGastos');
    cont.innerHTML = "";
    const mesSeleccionado = document.getElementById('mesFiltro').value;

    // Ahora leemos de un nodo central, no del mes
    db.ref('configuracion/gastos_recurrentes').once('value', snapshot => {
        const gastos = snapshot.val() || {};
        
        Object.keys(gastos).forEach(cat => {
            const rubro = gastos[cat];
            let itemsHtml = (rubro.items || []).map((it, i) => {
                // FILTRO AUTOMÁTICO DE LÍNEA DE TIEMPO
                if (it.desde && mesSeleccionado < it.desde) return '';
                if (it.hasta && mesSeleccionado > it.hasta) return '';

                return `
                <div class="gasto-row" style="border-left: 4px solid ${it.hasta === mesSeleccionado ? 'var(--rojo)' : 'var(--acento)'}">
                    <div class="gasto-header">
                        <input class="gasto-input-txt" value="${it.nombre}" onchange="updateGastoRecurrente('${cat}', ${i}, 'nombre', this.value)">
                        <button onclick="eliminarGastoRecurrente('${cat}', ${i})" style="color:#ef4444; background:none; border:none; cursor:pointer;">✕</button>
                    </div>
                    
                    <div class="gasto-inputs" style="display:grid; grid-template-columns: 1fr 1fr 80px; gap:10px;">
                        <div style="position:relative;">
                            <span style="position:absolute; left:5px; top:8px; color:var(--verde);">$</span>
                            <input type="number" value="${it.monto}" onchange="updateGastoRecurrente('${cat}', ${i}, 'monto', this.value)" style="padding-left:15px; font-weight:bold;">
                        </div>
                        <select onchange="updateGastoRecurrente('${cat}', ${i}, 'semana', this.value)">
                            <option value="1" ${it.semana==1?'selected':''}>Semana 1</option>
                            <option value="2" ${it.semana==2?'selected':''}>Semana 2</option>
                            <option value="3" ${it.semana==3?'selected':''}>Semana 3</option>
                            <option value="4" ${it.semana==4?'selected':''}>Semana 4</option>
                        </select>
                         <button class="btn-mini" style="height:35px" onclick="cambiarPeriodo('${cat}', ${i})">📅 PLAZO</button>
                    </div>

                    <div style="margin-top:8px; display:flex; gap:10px;">
                        <span class="gasto-badge badge-inicio">DESDE: ${it.desde || 'SIEMPRE'}</span>
                        <span class="gasto-badge ${it.hasta ? 'badge-fin' : ''}">${it.hasta ? 'HASTA: ' + it.hasta : 'INDEFINIDO'}</span>
                    </div>
                </div>`;
            }).join('');

            cont.innerHTML += `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <h3 style="margin:0; font-size:14px; letter-spacing:1px;">${cat.toUpperCase()}</h3>
                        <button class="btn-mini" onclick="nuevoGastoRecurrente('${cat}')" style="background:var(--acento); color:white;">+ AÑADIR</button>
                    </div>
                    ${itemsHtml}
                </div>`;
        });
    });
}

    function nuevoGastoRecurrente(cat) {
    const mesActual = document.getElementById('mesFiltro').value;
    db.ref(`configuracion/gastos_recurrentes/${cat}/items`).once('value', snap => {
        const items = snap.val() || [];
        items.push({
            nombre: "Nuevo Gasto",
            monto: 0,
            semana: 1,
            desde: mesActual, // Nace en el mes que estás viendo
            hasta: ""         // Por defecto es para siempre
        });
        db.ref(`configuracion/gastos_recurrentes/${cat}/items`).set(items).then(() => {
            dibujarGastos();
            proyectarTodo();
        });
    });
}
