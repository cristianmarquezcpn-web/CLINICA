<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>CFO TITANIUM v8.5 - INTELIGENCIA FULL</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #05070a; --panel: #111827; --acento: #3b82f6; --verde: #10b981; --rojo: #ef4444; --oro: #f59e0b; --texto: #f8fafc; }

        .card { background: var(--panel); padding: 15px; border-radius: 12px; border: 1px solid #1f2937; margin-bottom: 15px; }
        h3 { margin: 0 0 10px 0; font-size: 10px; text-transform: uppercase; color: var(--acento); letter-spacing: 1px; }
        input { background: #05070a; border: 1px solid #374151; color: white; padding: 10px; border-radius: 8px; width: 100%; margin-bottom: 8px; box-sizing: border-box; font-weight: 600; }
        .btn { background: var(--acento); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .sem-card { background: #1f2937; padding: 15px; border-radius: 10px; text-align: center; border-bottom: 4px solid var(--acento); }
        .monto-final { font-size: 16px; font-weight: 800; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div id="iaBanner"></div>

<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="margin:0">🧠 CFO <span style="color:var(--acento)">TITANIUM v8.5</span></h2>
    <div style="display:flex; gap:10px;">
        <input type="month" id="mesFiltro" onchange="conectarMes()" style="margin:0; width:180px;">
        <button class="btn" onclick="dispararMotorTitanium()" style="background:var(--oro); color:black; width:auto; padding: 0 15px;">
    ⚡ SINCRO TOTAL
        </button>
        <button class="btn" onclick="conectarMes()" style="background:#374151; width:auto; padding: 0 15px;">🔄 RECONECTAR</button>
        <button onclick="window.location.href='index.html'" style="background: transparent; border: 1px solid #374151; color: #94a3b8; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-size: 11px;">← VOLVER</button>
    </div>
</div>

<div class="grid-master">
    <div>
        <div class="card">
            <h3>🏦 Saldo Inicial (Arrastre)</h3>
            <div id="infoArrastre" style="font-size:10px; color:var(--oro); margin-bottom:10px; font-weight:bold;"></div>
            <label style="font-size:9px">CAJA GALICIA</label>
            <input type="number" id="bancoGalicia" onchange="guardarBancos()">
            <label style="font-size:9px">CAJA SANTANDER</label>
            <input type="number" id="bancoSantander" onchange="guardarBancos()">
        </div>
        <div class="card">
            <h3>💸 Gastos Operativos</h3>
            <div id="contGastos"></div>
            <button class="btn" style="background:#1f2937" onclick="nuevaCategoria()">+ RUBRO</button>
        </div>
    </div>

    <div>
        <div class="card">
            <h3>📈 Flujo Semanal (Proyectado desde Cobranzas)</h3>
            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;" id="gridSemanas"></div>
            <div id="resumenMensual"></div>
        </div>
        <div class="card">
            <h3>🧪 Simulador de Impacto</h3>
            <div style="display:flex; gap:10px; margin-bottom:10px;">
                <input type="number" id="simMonto" placeholder="$ Gasto Mensual">
                <input type="number" id="simMeses" placeholder="Meses" style="width:100px">
            </div>
            <button class="btn" style="background:var(--oro); color:black" onclick="simularImpacto()">ANALIZAR SOLVENCIA</button>
            <div id="resSim" style="margin-top:10px; font-weight:bold;"></div>
        </div>
    </div>

    <div>
        <div class="card">
            <h3>📊 Resumen de Salud</h3>
            <div id="saludNegocio" style="font-size:13px; line-height:2.5"></div>
        </div>
        <div class="card">
            <h3>🧬 Variables del Motor</h3>
            <div id="motorVars" style="font-size:11px; line-height:2.5"></div>
            <div id="statusIA" style="font-size:9px; color:var(--acento); margin-top:10px;"></div>
        </div>
    </div>
</div>
<script>
// 1. CONFIGURACIÓN ÚNICA
    const firebaseConfig = { 
        apiKey: "AIzaSyAugXXx_b_wKFByhDbLZslk2HA_UTzrzd8", 
        authDomain: "clinicaintegral-5c488.firebaseapp.com", 
        databaseURL: "https://clinicaintegral-5c488-default-rtdb.firebaseio.com", 
        projectId: "clinicaintegral-5c488", 
        storageBucket: "clinicaintegral-5c488.firebasestorage.app", 
        messagingSenderId: "184090967634", 
        appId: "1:184090967634:web:09715937b33ea48288698b" 
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }

    // Inicialización de servicios (Movido arriba para evitar errores de referencia)
    const db = firebase.database();
    const auth = firebase.auth();
    
    let refMes = null; 
    let datosMes = {};
    let motorGlobal = {};

    function dispararMotorTitanium() {
        const motorRef = db.ref('comandos/ejecutar_motor');

        motorRef.set({
            status: 'request',
            timestamp: Date.now()
        }).then(() => {
            console.log("🚀 Señal enviada al Motor Titanium...");
        }).catch((error) => {
            console.error("❌ Error al disparar el motor:", error);
        });
    }

    // 1. ESCUCHA MOTOR IA
    db.ref('tesoreria/motor_ia').on('value', snap => {
        const val = snap.val() || {};
        motorGlobal = val; 

        const m = val.mercado || {};
        const rep = val.reporte || {}; 
        const consejos = val.bot_financiero || []; 

        const eficienciaReal = rep.calle > 0 ? (rep.esperado / rep.calle) : 0.85;
        const colorRiesgo = m.riesgo > 1300 ? 'var(--rojo)' : 'var(--oro)';
        const colorEstado = rep.estado === "CRÍTICO" ? 'var(--rojo)' : 'var(--verde)';

        const motorVars = document.getElementById('motorVars');
        if (motorVars) {
            motorVars.innerHTML = `
                Efectividad Stress: <b style="color:${colorEstado}">${(eficienciaReal * 100).toFixed(1)}%</b><br>
                Delay Entrenado: <b style="color:var(--acento)">${rep.delay_historico || 60} días</b><br>
                Supervivencia: <b>${rep.supervivencia || 0} días</b>
                <hr style="border:0; border-top:1px solid #1f2937; margin:5px 0">
                Dólar MEP: <b style="color:var(--acento)">$${m.mep || '-'}</b><br>
                Riesgo País: <b style="color:${colorRiesgo}">${m.riesgo || 0} pts</b><br>
                <hr style="border:0; border-top:1px solid #1f2937; margin:5px 0">
                🏦 Tasa PF: <b>${(m.pf || 0).toFixed(1)}%</b><br>
                📱 Billeteras (FCI): <b style="color:var(--verde)">${(m.fci || 0).toFixed(1)}%</b><br>
                <hr style="border:0; border-top:1px solid #1f2937; margin:5px 0">
                📢 <span style="font-size:11px; color:var(--oro)"><b>AI BOT:</b> ${consejos[0] || 'Analizando...'}</span>
            `;
        }
        
        const statusIA = document.getElementById('statusIA');
        if (statusIA) {
            statusIA.innerText = `Sincro Motor: ${val.ultima_sincro || 'Pendiente'}`;
        }
        
        const selectMes = document.getElementById('mesFiltro');
        const mesActual = selectMes ? selectMes.value : null;

        if (mesActual) {
            actualizarBannerDinamico(mesActual);
            proyectarTodo();
        }
    });
    // 2. CONECTAR MES Y ARRASTRE
    async function conectarMes() {
    const mes = document.getElementById('mesFiltro').value;
    if (!mes) return;
    if (refMes) refMes.off();

    const [y, m] = mes.split('-').map(Number);
    // Mejora en la lógica de cálculo del mes anterior
    const mAnt = m === 1 ? `${y - 1}-12` : `${y}-${String(m - 1).padStart(2, '0')}`;
    
    const snapAnt = await db.ref(`tesoreria/meses/${mAnt}/cierre`).once('value');
    const arrastre = snapAnt.val() || 0;
    
    const infoArrastre = document.getElementById('infoArrastre');
    if (infoArrastre) {
        infoArrastre.innerText = `⚠ Arrastre de ${mAnt}: $${Math.round(arrastre).toLocaleString()}`;
    }

    refMes = db.ref(`tesoreria/meses/${mes}`);
    refMes.on('value', snap => {
        const data = snap.val();
        if (data) {
            datosMes = data;
            document.getElementById('bancoGalicia').value = data.bancos?.galicia || 0;
            document.getElementById('bancoSantander').value = data.bancos?.santander || 0;
        } else {
            document.getElementById('bancoGalicia').value = arrastre;
            document.getElementById('bancoSantander').value = 0;
            datosMes = { 
                bancos: { galicia: arrastre, santander: 0 }, 
                gastos: {},
                metadata: { creado: new Date().toISOString() } 
            };
        }
        if (typeof dibujarGastos === 'function') dibujarGastos(); 
        proyectarTodo();
    });
}

async function proyectarTodo() {
    const mesSeleccionado = document.getElementById('mesFiltro').value;
    if (!mesSeleccionado) return;

    let saldoAcumulado = (parseFloat(document.getElementById('bancoGalicia').value) || 0) + 
                         (parseFloat(document.getElementById('bancoSantander').value) || 0);
    
    let ingS = { 1: 0, 2: 0, 3: 0, 4: 0 }, gasS = { 1: 0, 2: 0, 3: 0, 4: 0 };
    let detG = { 1: [], 2: [], 3: [], 4: [] };

    const [snapFacts, snapSaei, snapCobros, snapGastos] = await Promise.all([
        db.ref('facturas_emitidas').once('value'),
        db.ref('facturas_emitidas_saei').once('value'),
        db.ref('cobranzas').once('value'),
        db.ref('configuracion/gastos_recurrentes').once('value')
    ]);

    const todasLasFacturas = { ...(snapFacts.val() || {}), ...(snapSaei.val() || {}) };
    const cobranzas = snapCobros.val() || {};
    const gastosMaestros = snapGastos.val() || {};

    const reporteGral = motorGlobal.reporte || {};
    const delayBase = reporteGral.delay_historico || 60;
    const eficienciaBase = (reporteGral.esperado / reporteGral.calle) || 0.85;

    const hoy = new Date();
    const hoyISO = hoy.toISOString().slice(0, 7);
    const semAct = Math.min(Math.ceil(hoy.getDate() / 7), 4);

    const parseFecha = (s) => {
        if (!s) return null;
        let p = s.includes('/') ? s.split('/') : s.split('-');
        return s.includes('/') ? new Date(p[2], p[1]-1, p[0]) : new Date(p[0], p[1]-1, p[2]);
    };

    let acumuladorIngresos = { 1: {}, 2: {}, 3: {}, 4: {} };

    // Dentro de tu forEach en proyectarTodo:
Object.keys(todasLasFacturas).forEach(id => {
    const f = todasLasFacturas[id];
    const cobro = cobranzas[id];
    
    const totalFactura = parseFloat(f.total || f.monto || 0);
    
    // Conciliación aritmética: sumamos todo lo que reduce la deuda
    const cobrado = cobro ? parseFloat(cobro.monto_cobrado || 0) : 0;
    const debito = cobro ? parseFloat(cobro.monto_debito || 0) : 0;
    
    // El saldo real es el total menos los pagos y los ajustes/débitos
    const saldoPendiente = totalFactura - (cobrado + debito);

    // Si el saldo es menor o igual a 0, significa que la factura está saldada o ajustada
    if (saldoPendiente <= 0) return; 

        const inteligencia = motorGlobal.inteligencia_cuit || [];
        const estudio = inteligencia.find(i => i.cuit === f.receptor_cuit);
        const dUso = estudio ? (estudio.delay || estudio.delay_historico) : delayBase;
        const iUso = estudio ? (estudio.indice || eficienciaBase) : eficienciaBase;

        const fEmision = parseFecha(f.fecha_emision || f.fecha);
        if (!fEmision) return;

        let fCobro = new Date(fEmision);
        fCobro.setDate(fCobro.getDate() + dUso);

        const mesC = fCobro.toISOString().slice(0, 7);
        let s = 1; // Valor por defecto para evitar undefined

        if (mesC < mesSeleccionado) { 
            s = (mesSeleccionado === hoyISO) ? semAct : 1; 
        } else if (mesC === mesSeleccionado) {
            const semC = Math.min(Math.ceil(fCobro.getDate() / 7), 4);
            s = (mesSeleccionado === hoyISO && semC < semAct) ? semAct : semC;
        } else { return; }


        const montoP = saldoPendiente * iUso; 
        const nombreOS = (f.receptor_nombre || 'S/D').trim().toUpperCase();

        if (!acumuladorIngresos[s][nombreOS]) {
            acumuladorIngresos[s][nombreOS] = { monto: 0, delay: dUso, esMora: (fCobro < hoy) };
        }
        acumuladorIngresos[s][nombreOS].monto += montoP;
        ingS[s] += montoP;
    });

    Object.keys(gastosMaestros).forEach(id => {
        const g = gastosMaestros[id];
        if (!g.monto || g.monto <= 0) return;
        let sG = g.dia_pago ? Math.min(Math.ceil(g.dia_pago / 7), 4) : 1;
        gasS[sG] += parseFloat(g.monto);
        detG[sG].push(`
            <div style="display:flex; justify-content:space-between; font-size:10px; color:#fca5a5; margin-bottom:2px;">
                <span>📉 ${g.nombre.substring(0,12)}</span>
                <span>$${Math.round(g.monto/1000)}k</span>
            </div>
        `);
    });

    const grid = document.getElementById('gridSemanas');
    if (grid) {
        grid.innerHTML = ""; 
        for (let i = 1; i <= 4; i++) {
            saldoAcumulado += (ingS[i] - gasS[i]);
            const sortedOS = Object.keys(acumuladorIngresos[i]).sort((a,b) => acumuladorIngresos[i][b].monto - acumuladorIngresos[i][a].monto);
            
            let htmlIngresos = sortedOS.map(os => {
                const info = acumuladorIngresos[i][os];
                return `
                    <div style="display:flex; justify-content:space-between; font-size:10px; margin-bottom:3px; border-bottom:1px solid #1e293b; padding-bottom:2px;">
                        <span style="color:${info.esMora ? 'var(--rojo)' : 'var(--acento)'}; font-weight:bold;">
                            ${info.esMora ? '⚠️' : '🤖'} ${os.substring(0, 12)}
                        </span>
                        <span style="color:#e2e8f0;">$${Math.round(info.monto/1000)}k</span>
                    </div>`;
            }).join('');

            grid.innerHTML += `
                <div class="sem-card" style="border-top: 3px solid ${saldoAcumulado < 0 ? 'var(--rojo)':'var(--verde)'}; padding:10px; background:#0f172a; border-radius:8px; display:flex; flex-direction:column; min-height:200px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <span style="font-size:10px; color:#94a3b8;">${(i === semAct && mesSeleccionado === hoyISO) ? '⭐ ACTUAL' : 'SEMANA ' + i}</span>
                        <b style="color:${saldoAcumulado < 0 ? 'var(--rojo)':'#4ade80'}; font-size:15px;">$${Math.round(saldoAcumulado).toLocaleString()}</b>
                    </div>
                    <div style="flex-grow:1; overflow-y:auto; max-height:150px; margin-bottom:10px; scrollbar-width: thin;">
                        ${htmlIngresos}
                        <div style="margin-top:8px; border-top: 1px dashed #334155; pt:4px;">${detG[i].join('')}</div>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:10px; border-top:1px solid #334155; padding-top:6px; font-weight:bold;">
                        <span style="color:var(--verde)">+ $${Math.round(ingS[i]/1000)}k</span>
                        <span style="color:var(--rojo)">- $${Math.round(gasS[i]/1000)}k</span>
                    </div>
                </div>`;
        }
    }

    const totalMesIng = Object.values(ingS).reduce((a,b) => a+b, 0);
    const totalMesGas = Object.values(gasS).reduce((a,b) => a+b, 0);
    const resumenDiv = document.getElementById('resumenMensual');
    if(resumenDiv) {
        resumenDiv.innerHTML = `
            <div style="display:flex; justify-content:around; background:#1e293b; padding:10px; border-radius:10px; margin-top:15px; color:white;">
                <div style="text-align:center; flex:1;">
                    <small style="color:#94a3b8;">INGRESOS ESPERADOS</small><br>
                    <b style="color:var(--verde); font-size:18px;">$${Math.round(totalMesIng).toLocaleString()}</b>
                </div>
                <div style="text-align:center; flex:1; border-left:1px solid #334155;">
                    <small style="color:#94a3b8;">GASTOS TOTALES</small><br>
                    <b style="color:var(--rojo); font-size:18px;">$${Math.round(totalMesGas).toLocaleString()}</b>
                </div>
            </div>`;
    }
    window.saldoFinalProyectado = saldoAcumulado; 
    actualizarBannerDinamico(mesSeleccionado);
}
function actualizarBannerDinamico(mesSel) {
    const banner = document.getElementById('iaBanner');
    if (!banner) return; // Seguridad si el elemento no existe

    const motor = motorGlobal || {}; 
    const m = motor.mercado || { mep: 1250, riesgo: 1200, rem: 4, pf: 60, fci: 52 };
    const rep = motor.reporte || {}; 
    const consejosDelBot = motor.bot_financiero || []; 
    const intelCuit = motor.inteligencia_cuit || []; 

    // Si no hay datos de deuda, ocultamos para no mostrar basura
    if (!rep.calle) {
        banner.style.display = "none";
        return;
    }

    const diasVida = rep.supervivencia || 0;
    const mep = m.mep || 1;
    const inflacionMensual = m.rem || 4;
    const deudaCalle = rep.calle || 0;

    // Cálculos financieros
    const perdidaInflacion = deudaCalle * (inflacionMensual / 100);
    const sangriaUSD = (deudaCalle / mep) * (inflacionMensual / 100);

    // Lógica de Semáforo (Panick Mode)
    const MODO_PANICO = rep.estado === "CRÍTICO" || diasVida < 20;
    let colorBorde = MODO_PANICO ? '#ef4444' : (diasVida > 60 ? '#10b981' : '#f59e0b');

    banner.style.display = "block";
    banner.innerHTML = `
        <div style="background:rgba(10,10,20,0.98); border:2px solid ${colorBorde}; border-left:15px solid ${colorBorde}; border-radius:15px; padding:25px; color:#fff; font-family: 'Segoe UI', sans-serif; box-shadow: 0 15px 50px rgba(0,0,0,0.7); margin-bottom:20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:15px; margin-bottom:20px;">
                <div><h2 style="margin:0; font-size:24px; color:${colorBorde}; font-weight:900;">${MODO_PANICO ? '🚨 ESTADO: ' + (rep.estado || 'CRÍTICO') : '🛡️ SISTEMA TITANIUM'}</h2></div>
                <div style="text-align:right; background:rgba(255,255,255,0.05); padding:10px 20px; border-radius:12px;">
                    <span style="font-size:11px; color:#888;">PÉSIMO (VaR p5) + BANCOS:</span><br>
                    <b style="font-size:28px; color:${colorBorde};">${diasVida} DÍAS</b>
                </div>
            </div>

            <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px; margin-bottom:20px; background:rgba(255,255,255,0.03); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.05);">
                <div style="text-align:center;"><span style="font-size:10px; color:#888;">PLAZO FIJO</span><br><b style="color:#60a5fa; font-size:18px;">${m.pf || 0}%</b></div>
                <div style="text-align:center; border-left:1px solid rgba(255,255,255,0.1);"><span style="font-size:10px; color:#888;">FCI / BILL.</span><br><b style="color:#10b981; font-size:18px;">${m.fci || 0}%</b></div>
                <div style="text-align:center; border-left:1px solid rgba(255,255,255,0.1);"><span style="font-size:10px; color:#888;">INFLACIÓN</span><br><b style="color:#ef4444; font-size:18px;">${inflacionMensual}%</b></div>
                <div style="text-align:center; border-left:1px solid rgba(255,255,255,0.1);"><span style="font-size:10px; color:#888;">DOLAR MEP</span><br><b style="color:#60a5fa; font-size:18px;">$${mep}</b></div>
            </div>

            <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:20px; margin-bottom:20px;">
                <div style="background:rgba(239,68,68,0.03); padding:20px; border-radius:12px; border:1px solid rgba(239,68,68,0.3);">
                    <h3 style="margin:0 0 15px 0; font-size:13px; color:#ef4444; text-transform:uppercase;">🩸 Sangría en Calle</h3>
                    <div style="background:rgba(239,68,68,0.1); padding:15px; border-radius:10px; margin-bottom:10px;">
                        <p style="margin:0; font-size:11px; color:#ef4444;">PÉRDIDA ESTIMADA:</p>
                        <b style="font-size:24px;">-$${Math.round(perdidaInflacion).toLocaleString()}</b>
                    </div>
                    <div style="font-size:13px; color:#aaa;">Equivale a: <b style="color:#eee">U$D ${Math.round(sangriaUSD)}</b></div>
                </div>
                <div style="background:rgba(255,255,255,0.02); padding:20px; border-radius:12px; border:1px solid ${colorBorde};">
                    <h3 style="margin:0 0 15px 0; font-size:12px; color:${colorBorde}; text-transform:uppercase;">🤖 Recomendaciones</h3>
                    <div style="font-size:14px; color:#ddd; line-height:1.6;">
                        ${consejosDelBot.length > 0 
                            ? consejosDelBot.map(c => `<div style="margin-bottom:8px; padding-left:15px; border-left:2px solid ${colorBorde};">${c}</div>`).join('')
                            : 'Analizando flujos para optimizar...'}
                    </div>
                </div>
            </div>

            <div style="background:rgba(255,255,255,0.03); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.05);">

// --- FUNCIONES DE APOYO DEL MOTOR IA ---
function parseFecha(s) { 
    if (!s) return null;
    if (s instanceof Date) return s;
    
    // Detecta el separador y divide la cadena
    const sep = s.includes('/') ? '/' : '-';
    const p = s.split(sep); // 🟢P
    
    // Si el primer segmento tiene 4 dígitos, es formato YYYY-MM-DD
    if (p[0].length === 4) {
        return new Date(p[0], p[1] - 1, p[2]);
    } // 🔵AC
    
    // De lo contrario, asume DD/MM/YYYY
    return new Date(p[2], p[1] - 1, p[0]);
}

function limpiarOutliers(arr) { 
    if (arr.length < 4) return arr; 
    
    // Clonamos para no mutar el array original accidentalmente
    const temp = [...arr].sort((a, b) => a - b); 
    
    // Recorte simétrico del 10% en ambos extremos
    const inicio = Math.floor(temp.length * 0.1);
    const fin = Math.ceil(temp.length * 0.9);
    
    return temp.slice(inicio, fin); 
}

function mediaPonderada(arr) { 
    if (!arr || !arr.length) return 65; 
    
    const sum = arr.reduce((a, b) => a + b, 0); 
    return Math.round(sum / arr.length); 
}

// --- PROCESO DE ENTRENAMIENTO DINÁMICO ---

async function verificarYEntrenar() {
    // 1. CAPTURA TOTAL DE DATOS (Facturas de ambos pulmones + Gastos Maestros)
    const [fSnap, sSnap, gSnap] = await Promise.all([
        db.ref('facturas_emitidas').once('value'),
        db.ref('facturas_emitidas_saei').once('value'),
        db.ref('configuracion/gastos_recurrentes').once('value')
    ]);
    
    const facturas = { ...(fSnap.val() || {}), ...(sSnap.val() || {}) };
    const gastosMaestros = gSnap.val() || {};
    const cantidadActual = Object.keys(facturas).length;
    
    // 2. VERIFICACIÓN DE ESTADO DEL MOTOR
    const motorSnap = await db.ref('tesoreria/motor_ia').once('value');
    const motorData = motorSnap.val() || { cantidad_entrenada: 0 };

    // Solo entrenamos si hay facturas nuevas o cambios detectados 🔵AC
    if (cantidadActual !== motorData.cantidad_entrenada) {
        const statusIA = document.getElementById('statusIA');
        if (statusIA) statusIA.innerText = "🤖 IA: Analizando cobros y gastos fijos...";
        
        const cSnap = await db.ref('cobranzas').once('value');
        const cobranzas = cSnap.val() || {};
        
        // 3. EJECUCIÓN DEL APRENDIZAJE
        try {
            await ejecutarIA(facturas, cobranzas, gastosMaestros);
            
            // 4. ACTUALIZACIÓN DE METADATOS
            await db.ref('tesoreria/motor_ia').update({ 
                cantidad_entrenada: cantidadActual, 
                ultima_sincro: new Date().toLocaleString("es-AR"),
                estado: "optimizado"
            });
            
            if (statusIA) statusIA.innerText = "✅ Motor Sincronizado";
            
            // Refrescamos la UI con los nuevos parámetros aprendidos
            if (typeof proyectarTodo === 'function') proyectarTodo(); 
            
        } catch (error) {
            console.error("❌ Error en entrenamiento IA:", error);
            if (statusIA) statusIA.innerText = "⚠️ Error en Sincronización";
        }
    } else {
        const statusIA = document.getElementById('statusIA');
        if (statusIA) statusIA.innerText = "✅ Motor al día";
    }
}

// 1. GESTIÓN DE BANCOS (ESTADO BASE)
function guardarBancos() {
    const mes = document.getElementById('mesFiltro').value;
    const galicia = parseFloat(document.getElementById('bancoGalicia').value) || 0;
    const santander = parseFloat(document.getElementById('bancoSantander').value) || 0;

    db.ref(`tesoreria/meses/${mes}/bancos`).update({
        galicia: galicia,
        santander: santander
    }).then(() => {
        // Forzamos al motor a recalcular con los nuevos saldos reales 🔵AC
        if (typeof verificarYEntrenar === 'function') verificarYEntrenar(); 
        if (typeof proyectarTodo === 'function') proyectarTodo();
    });
}

// 2. RENDERIZADO DE GASTOS (INTERFAZ)
function dibujarGastos() {
    const cont = document.getElementById('contGastos');
    if (!cont) return;
    cont.innerHTML = "";
    const mesSeleccionado = document.getElementById('mesFiltro').value;

    db.ref('configuracion/gastos_recurrentes').once('value', snapshot => {
        const gastos = snapshot.val() || {};
        
        Object.keys(gastos).forEach(cat => {
            const rubro = gastos[cat];
            const items = rubro.items || [];
            
            let itemsHtml = items.map((it, i) => {
                // Filtro de línea de tiempo: si el mes no está en rango, no se dibuja 🟢P
                if (it.desde && mesSeleccionado < it.desde) return '';
                if (it.hasta && mesSeleccionado > it.hasta) return '';

                const esUltimoMes = it.hasta === mesSeleccionado;

                return `
                <div class="gasto-row" style="border-left: 4px solid ${esUltimoMes ? '#ef4444' : '#3b82f6'}; margin-bottom:10px; padding:10px; background:rgba(255,255,255,0.02); border-radius:8px;">
                    <div class="gasto-header" style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <input class="gasto-input-txt" value="${it.nombre}" onchange="updateGastoRecurrente('${cat}', ${i}, 'nombre', this.value)" style="background:none; border:none; color:#fff; font-weight:600; width:80%;">
                        <button onclick="eliminarGastoRecurrente('${cat}', ${i})" style="color:#ef4444; background:none; border:none; cursor:pointer; font-size:16px;">✕</button>
                    </div>
                    
                    <div class="gasto-inputs" style="display:grid; grid-template-columns: 1fr 1fr 80px; gap:10px;">
                        <div style="position:relative;">
                            <span style="position:absolute; left:8px; top:8px; color:#10b981;">$</span>
                            <input type="number" value="${it.monto}" onchange="updateGastoRecurrente('${cat}', ${i}, 'monto', this.value)" style="padding-left:20px; width:100%; background:rgba(0,0,0,0.3); border:1px solid #333; color:#fff; border-radius:5px; height:35px;">
                        </div>
                        <select onchange="updateGastoRecurrente('${cat}', ${i}, 'semana', this.value)" style="background:#222; color:#fff; border:1px solid #333; border-radius:5px;">
                            <option value="1" ${it.semana == 1 ? 'selected' : ''}>Semana 1</option>
                            <option value="2" ${it.semana == 2 ? 'selected' : ''}>Semana 2</option>
                            <option value="3" ${it.semana == 3 ? 'selected' : ''}>Semana 3</option>
                            <option value="4" ${it.semana == 4 ? 'selected' : ''}>Semana 4</option>
                        </select>
                         <button class="btn-mini" onclick="cambiarPeriodo('${cat}', ${i})" style="font-size:10px; background:#444; color:#ccc; border:none; border-radius:4px;">📅 PLAZO</button>
                    </div>

                    <div style="margin-top:8px; display:flex; gap:10px; font-size:10px; opacity:0.6;">
                        <span class="gasto-badge">DESDE: ${it.desde || 'INICIO'}</span>
                        <span class="gasto-badge" style="${it.hasta ? 'color:#ef4444' : ''}">${it.hasta ? 'HASTA: ' + it.hasta : 'INDEFINIDO'}</span>
                    </div>
                </div>`;
            }).join('');

            cont.innerHTML += `
                <div class="card" style="background:#111; border:1px solid #222; padding:15px; border-radius:12px; margin-bottom:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #222; padding-bottom:10px;">
                        <h3 style="margin:0; font-size:12px; color:#888; letter-spacing:1.5px; text-transform:uppercase;">${cat}</h3>
                        <button class="btn-mini" onclick="nuevoGastoRecurrente('${cat}')" style="background:#3b82f6; color:white; border:none; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:11px;">+ AÑADIR</button>
                    </div>
                    ${itemsHtml || '<p style="font-size:11px; color:#444; text-align:center;">Sin gastos activos este mes</p>'}
                </div>`;
        });
    });
}

// 3. ACTUALIZACIÓN (PERSISTENCIA)
function updateGastoRecurrente(cat, idx, campo, valor) {
    if (campo === 'monto') valor = parseFloat(valor) || 0;
    
    db.ref(`configuracion/gastos_recurrentes/${cat}/items/${idx}`)
      .update({ [campo]: valor })
      .then(() => {
          if (typeof proyectarTodo === 'function') proyectarTodo(); // 🔵AC
      });
}

// 4. ELIMINACIÓN SEGURA
function eliminarGastoRecurrente(cat, idx) {
    if(!confirm(`¿Eliminar este gasto de ${cat}?`)) return;

    const ref = db.ref(`configuracion/gastos_recurrentes/${cat}/items`);
    
    ref.once('value', snap => {
        let items = snap.val() || [];
        items.splice(idx, 1); 
        
        // Si no quedan ítems, podemos optar por dejar el array vacío o borrar el nodo
        if (items.length === 0) {
            db.ref(`configuracion/gastos_recurrentes/${cat}`).remove();
        } else {
            ref.set(items);
        }
    }).then(() => {
        dibujarGastos();
        if (typeof proyectarTodo === 'function') proyectarTodo();
    });
}

// --- SIMULADOR DE IMPACTO FINANCIERO ---
function simularImpacto() {
    const montoSimulado = parseFloat(document.getElementById('simMonto').value) || 0;
    const mesesSimulados = parseInt(document.getElementById('simMeses').value) || 1;
    const res = document.getElementById('resSim');

    if (!res) return;

    // 1. CONSUMIMOS LA REALIDAD PROBABILÍSTICA (Del Motor IA)
    const motorData = window.motorGlobal || {}; 
    const saldoPesimista = motorData.var_pesimista || 0; 
    const burnRate = motorData.burn_rate || 0; 

    let tempSaldo = saldoPesimista;
    let mesesResistidos = 0;

    // 2. SIMULACIÓN CON GASTO ESTRUCTURAL
    for (let i = 0; i < mesesSimulados; i++) { 
        // El impacto real: gasto puntual + burn rate mensual recurrente
        tempSaldo -= (montoSimulado + burnRate); 
        if (tempSaldo >= 0) mesesResistidos++; 
    }

    // 3. RESPUESTA BASADA EN RIESGO
    const esViable = mesesResistidos >= mesesSimulados;
    res.style.color = esViable ? "#10b981" : "#ef4444";

    if (esViable) {
        res.innerText = `✅ VIABLE: Titanium confirma soporte por ${mesesSimulados} meses incluso en escenario de estrés.`;
    } else {
        const mesFalla = mesesResistidos + 1;
        res.innerText = `🚨 ALERTA: Quiebra técnica en el mes ${mesFalla} debido al Burn Rate estructural.`;
    }
}

    const filtroMes = document.getElementById('mesFiltro');
    if (filtroMes) {

    if (typeof verificarYEntrenar === 'function') verificarYEntrenar();
};

async function sincronizacionTotal(event) {
    const btn = event?.target;
    if (!btn) return;

    const originalText = btn.innerText;
    btn.innerText = "⏳ PROCESANDO IA...";
    btn.disabled = true;

    try {
        // 1. CAPTURA INTEGRAL
        const [fSnap, sSnap, cSnap, gSnap] = await Promise.all([
            db.ref('facturas_emitidas').once('value'),
            db.ref('facturas_emitidas_saei').once('value'),
            db.ref('cobranzas').once('value'),
            db.ref('configuracion/gastos_recurrentes').once('value')
        ]);
        
        const facturas = { ...(fSnap.val() || {}), ...(sSnap.val() || {}) };
        const cobranzas = cSnap.val() || {};
        const gastosMaestros = gSnap.val() || {};
        
        // 2. EJECUCIÓN DEL NÚCLEO 🟢P
        if (typeof ejecutarIA === 'function') {
            await ejecutarIA(facturas, cobranzas, gastosMaestros); 
        }
        
        // 3. REFRESCO DE INTERFAZ
        if (typeof conectarMes === 'function') await conectarMes();
        if (typeof proyectarTodo === 'function') await proyectarTodo();

        btn.innerText = "✅ ¡LISTO!";
        btn.style.backgroundColor = "#10b981";

        setTimeout(() => { 
            btn.innerText = originalText; 
            btn.disabled = false;
            btn.style.backgroundColor = "";
        }, 2500);

    } catch (e) {
        console.error("❌ Error Crítico en Sincronización:", e);
        btn.innerText = "❌ ERROR DE MOTOR";
        btn.disabled = false;
        
        setTimeout(() => { 
            btn.innerText = originalText; 
        }, 3000);
    }
}
